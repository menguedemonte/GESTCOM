<script>
// ============================================================
// ALMACENAMIENTO SEGURO
// ============================================================
const SafeStorage = {
  _mem: {}, _available: null,
  isAvailable() {
    if (this._available !== null) return this._available;
    try { const test = '__storage_test__'; window.localStorage.setItem(test, test); window.localStorage.removeItem(test); this._available = true; } catch(e) { this._available = false; }
    return this._available;
  },
  get(key) { try { if (this.isAvailable()) return window.localStorage.getItem(key); } catch(e) {} return this._mem[key] !== undefined ? this._mem[key] : null; },
  set(key, value) { try { if (this.isAvailable()) { window.localStorage.setItem(key, value); return; } } catch(e) {} this._mem[key] = value; },
  remove(key) { try { if (this.isAvailable()) { window.localStorage.removeItem(key); } } catch(e) {} delete this._mem[key]; }
};

// ============================================================
// CONSTANTES
// ============================================================
const STORAGE_KEY = 'gestcom_v30';
const USERS_KEY = 'gestcom_users_v30';
const SB_CONFIG_KEY = 'gestcom_sb_config_v30';

const MODULES = [
  { id: 'dashboard', name: 'Dashboard', icon: 'fa-chart-line', group: 'Principal' },
  { id: 'clientes', name: 'Clientes', icon: 'fa-users', group: 'Gestión' },
  { id: 'proveedores', name: 'Proveedores', icon: 'fa-truck', group: 'Gestión' },
  { id: 'vendedores', name: 'Vendedores', icon: 'fa-user-tie', group: 'Gestión' },
  { id: 'productos', name: 'Productos', icon: 'fa-boxes-stacked', group: 'Catálogo' },
  { id: 'listas', name: 'Listas de Precios', icon: 'fa-tags', group: 'Catálogo' },
  { id: 'compras', name: 'Compras', icon: 'fa-cart-shopping', group: 'Operaciones' },
  { id: 'ventas', name: 'Ventas', icon: 'fa-cash-register', group: 'Operaciones' },
  { id: 'inventario', name: 'Inventario & Lotes', icon: 'fa-warehouse', group: 'Operaciones' },
  { id: 'cuentas', name: 'Cuentas Corrientes', icon: 'fa-wallet', group: 'Operaciones' },
  { id: 'caja', name: 'Caja Diaria', icon: 'fa-cash-register', group: 'Operaciones' },
  { id: 'conexion', name: 'Conexión a Base', icon: 'fa-database', group: 'Sistema', adminOnly: true },
  { id: 'security', name: 'Seguridad RLS', icon: 'fa-shield-halved', group: 'Sistema', adminOnly: true },
  { id: 'users', name: 'Usuarios', icon: 'fa-user-shield', group: 'Sistema', adminOnly: true },
  { id: 'empresa', name: 'Datos de Empresa', icon: 'fa-building', group: 'Sistema', adminOnly: true }];

let state = { clientes: [], proveedores: [], vendedores: [], productos: [], listas: [], compras: [], ventas: [], stock: [], cuentas: [], movimientos: [], caja: [], cajaImputaciones: [], categorias: ['Lácteos','Carnes','Panadería','Bebidas','Conservas','Frutas y Verduras','Snacks','Cereales','Congelados','Enlatados'], zonas: ['Zona Norte','Zona Sur','Zona Este','Zona Oeste','Centro','Interior'] };
let appUsers = [];
let currentUser = null;
let currentModule = 'dashboard';
let stockTab = 'general';
let cuentasTab = 'clientes';
let cajaTab = 'resumen';
let cajaFecha = new Date().toISOString().split('T')[0];
let loginMode = 'signin';
let supabaseClient = null;
let dbMode = 'local';
let compraItems = [];
let ventaItems = [];
let mostrarAnulados = false;
let comprobanteItems = [];
let empresaData = { razonSocial: '', cuit: '', direccion: '', telefono: '', email: '', condicionIVA: '', logo: '' };

// ============================================================
// CONFIGURACIÓN DE AUTO-CONEXIÓN A SUPABASE
// ============================================================
const DEFAULT_SUPABASE_URL = 'https://hwosbnmavbmwhmiqibpn.supabase.co';
const DEFAULT_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3b3Nibm1hdmJtd2htaXFpYnBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NTE2MTgsImV4cCI6MjEwNzMyNzYxOH0.OWTs18ASCgK2zte0xM-uoRmne0MYf_tDD9xG_LzDf9E';


const today = () => new Date().toISOString().split('T')[0];
const fmt = n => '$' + Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const genUUID = () => {
  if (window.crypto && window.crypto.randomUUID) {
    try { return window.crypto.randomUUID(); } catch(e) {}
  }
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
};
const uid = () => genUUID();
const fmtDate = d => { if(!d) return '-'; const p = d.split('-'); return `${p[2]}/${p[1]}/${p[0]}`; };


function initAutoConexion() {
  try {
    const cfgStr = SafeStorage.get(SB_CONFIG_KEY);
    if (!cfgStr) {
      console.log('⚙️ Configuración no encontrada. Aplicando valores por defecto...');
      const defaultCfg = {
        url: DEFAULT_SUPABASE_URL,
        key: DEFAULT_SUPABASE_KEY
      };
      SafeStorage.set(SB_CONFIG_KEY, JSON.stringify(defaultCfg));
      
      // Intentar conectar inmediatamente si el objeto DB ya está disponible
      if (typeof DB !== 'undefined' && typeof DB.init === 'function') {
        DB.init(DEFAULT_SUPABASE_URL, DEFAULT_SUPABASE_KEY);
      }
    }
  } catch (e) {
    console.error('Error en auto-conexión:', e);
  }
} 


// ============================================================
// EDITAR Y ANULAR COMPROBANTES
// ============================================================
function editarComprobante(id) {
  const comp = state.cuentas.find(c => c.id === id);
  if (!comp) { toast('Comprobante no encontrado', 'error'); return; }

   // 🔒 Validación defensiva
  if (comp.anulado) { toast('No se puede editar un comprobante anulado', 'error'); return; }  
  // Detectar si es "complejo" (tiene productos o movimiento de caja)
  const movsCaja = state.caja.filter(m => m.refId === id || (m.datosExtra && m.datosExtra.refComprobanteId === id));
  const movsInventario = (state.movimientos || []).filter(m => m.refId === id);
  const imputaciones = state.cajaImputaciones.filter(i => i.comprobanteId === id);
  
  const esComplejo = comp.tieneProductos || movsCaja.length > 0 || imputaciones.length > 0;
  
  if (esComplejo) {
    // Modo complejo: edición limitada + opción de anular y recrear
    openModal('Editar Comprobante (Modo Limitado)', `
      <div class="space-y-4">
        <div class="bg-amber-50 border-2 border-amber-300 rounded-lg p-4">
          <h4 class="font-bold text-amber-900 mb-2"><i class="fas fa-exclamation-triangle mr-2"></i>Comprobante con movimientos vinculados</h4>

            Este comprobante tiene ${comp.tieneProductos ? 'productos asociados' : ''} 
            ${movsCaja.length > 0 ? `${movsCaja.length} movimiento(s) en Caja` : ''} 
            ${imputaciones.length > 0 ? `${imputaciones.length} imputación(es)` : ''}.
            <br><br>
            <b>Solo podés editar campos seguros:</b> fecha, vencimiento, concepto y observaciones.
            <br><br>
            Si necesitás cambiar el importe, productos o tipo de comprobante, usá la opción 
            <b>"Anular y recrear"</b> al final del formulario.
          </p>
        </div>
        
        <div id="formEditarComp" class="space-y-4">
          <div class="grid grid-cols-2 gap-3">
            <div>${lbl('Fecha comprobante', 'Fecha de emisión', true)}
              <input name="fecha" type="date" value="${comp.fecha}" class="w-full px-3 py-2 border rounded-lg">
            </div>
            <div>${lbl('Fecha vencimiento', 'Fecha de pago')}
              <input name="vencimiento" type="date" value="${comp.vencimiento || ''}" class="w-full px-3 py-2 border rounded-lg">
            </div>
            <div class="col-span-2">${lbl('Concepto', 'Descripción', true)}
              <input name="concepto" value="${comp.concepto || ''}" class="w-full px-3 py-2 border rounded-lg">
            </div>
            <div class="col-span-2">${lbl('Observaciones', 'Notas adicionales')}
              <textarea name="observaciones" rows="2" class="w-full px-3 py-2 border rounded-lg">${comp.observaciones || ''}</textarea>
            </div>
          </div>
          
          <div class="bg-slate-100 border rounded-lg p-3 text-sm">
            <h5 class="font-semibold mb-2">Campos de solo lectura:</h5>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <div><b>Tipo:</b> ${comp.tipo}</div>
              <div><b>Entidad:</b> ${comp.tipo === 'cliente' ? getCliente(comp.entityId)?.razonSocial : getProveedor(comp.entityId)?.razonSocial}</div>
              <div><b>Comprobante:</b> ${comp.tipoComprobante} ${comp.puntoVenta}-${comp.numero}</div>
              <div><b>Total:</b> ${fmt(comp.total)}</div>
              <div><b>Libro IVA:</b> ${comp.vaLibroIva ? 'Sí' : 'No'}</div>
              <div><b>Productos:</b> ${comp.tieneProductos ? 'Sí' : 'No'}</div>
            </div>
          </div>
          
          <div class="flex justify-between gap-2 pt-4 border-t">
            <button onclick="anularYRecrearComprobante('${comp.id}')" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg font-medium">
              <i class="fas fa-redo mr-1"></i>Anular y recrear
            </button>
            <div class="flex gap-2">
              <button onclick="closeModal()" class="px-4 py-2 border rounded-lg">Cancelar</button>
              <button onclick="guardarEdicionSimple('${comp.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-lg font-medium">
                <i class="fas fa-save mr-1"></i>Guardar cambios
              </button>
            </div>
          </div>
        </div>
      </div>

  } else {
    // Modo simple: edición completa (con opción de agregar productos si no tiene)
    const tieneProductos = comp.tieneProductos || false;
    
    // Inicializar comprobanteItems si no existe
    if (typeof comprobanteItems === 'undefined') comprobanteItems = [];
    comprobanteItems = [];
    
    openModal('Editar Comprobante', `
      <div id="formEditarCompCompleto" class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>${lbl('Tipo', 'Cliente o proveedor', true)}
            <select name="tipo" class="w-full px-3 py-2 border rounded-lg" disabled>
              <option value="cliente" ${comp.tipo === 'cliente' ? 'selected' : ''}>Cliente</option>
              <option value="proveedor" ${comp.tipo === 'proveedor' ? 'selected' : ''}>Proveedor</option>

          </div>
          <div>${lbl('Entidad', 'Cliente/Proveedor', true)}
            <select name="entityId" class="w-full px-3 py-2 border rounded-lg" disabled>
              <option value="${comp.entityId}">
                ${comp.tipo === 'cliente' ? getCliente(comp.entityId)?.razonSocial : getProveedor(comp.entityId)?.razonSocial}
              </option>
            </select>
          </div>
          <div>${lbl('Fecha comprobante', 'Fecha de emisión', true)}
            <input name="fecha" type="date" value="${comp.fecha}" class="w-full px-3 py-2 border rounded-lg">
          </div>
          <div>${lbl('Fecha vencimiento', 'Fecha de pago')}
            <input name="vencimiento" type="date" value="${comp.vencimiento || ''}" class="w-full px-3 py-2 border rounded-lg">
          </div>
          <div>${lbl('Tipo comprobante', 'Tipo de documento', true)}
            <select name="tipoComprobante" class="w-full px-3 py-2 border rounded-lg">
              ${['Factura A','Factura B','Factura C','Nota de Débito A','Nota de Débito B','Nota de Débito C','Nota de Crédito A','Nota de Crédito B','Nota de Crédito C','Recibo','Pago'].map(t => 
                `<option ${comp.tipoComprobante === t ? 'selected' : ''}>${t}</option>`
              ).join('')}
            </select>
          </div>

function calcEdicionComprobante() {
  const form = document.getElementById('formEditarCompCompleto');
  if (!form) return;
  const neto = parseFloat(form.querySelector('[name=neto]').value) || 0;
  const iva21 = parseFloat(form.querySelector('[name=iva21]').value) || 0;
  const iva105 = parseFloat(form.querySelector('[name=iva105]').value) || 0;
  const perc = parseFloat(form.querySelector('[name=percepciones]').value) || 0;
  const otros = parseFloat(form.querySelector('[name=otrosImp]').value) || 0;
  form.querySelector('[name=total]').value = (neto + iva21 + iva105 + perc + otros).toFixed(2);
}

function toggleProductosEdit() {
  const chk = document.getElementById('chkConProductosEdit');
  const section = document.getElementById('productosEditSection');
  if (chk && section) {
    section.classList.toggle('hidden', !chk.checked);
    if (chk.checked && comprobanteItems.length === 0) {
      addComprobanteProductoEdit();
    }
  }
}

function addComprobanteProductoEdit() {
  const form = document.getElementById('formEditarCompCompleto');
  const tipoSelect = form.querySelector('[name=tipo]');
  const tipo = tipoSelect ? tipoSelect.value : 'cliente';
  const esCliente = tipo === 'cliente';
  
  comprobanteItems.push({
    productoId: '',
    cantidad: 1,
    precioUnit: 0,
    loteId: '',
    costoUnit: 0
  });
  renderComprobanteProductosEdit();
}

function renderComprobanteProductosEdit() {
  const c = document.getElementById('comprobanteProductosEditList');
  if (!c) return;
  const form = document.getElementById('formEditarCompCompleto');
  const tipoSelect = form.querySelector('[name=tipo]');
  const tipo = tipoSelect ? tipoSelect.value : 'cliente';
  const esCliente = tipo === 'cliente';
  
  c.innerHTML = comprobanteItems.map((it, i) => {
    const lotes = it.productoId 
      ? state.stock.filter(s => s.productoId === it.productoId && s.cantidad > 0)
      : [];
    
    return `<div class="bg-slate-50 p-3 rounded-lg border">
      <div class="grid grid-cols-12 gap-2 items-end">
        <div class="col-span-4">
          <label class="text-xs font-medium">Producto *</label>
          <select onchange="updComprobanteProductoEdit(${i},'productoId',this.value)" class="w-full px-2 py-1 border rounded text-sm">
            <option value="">-</option>
            ${state.productos.map(p => `<option value="${p.id}" ${it.productoId === p.id ? 'selected' : ''}>${p.nombre}</option>`).join('')}
          </select>
        </div>
        ${esCliente ? `
        <div class="col-span-3">
          <label class="text-xs font-medium">Lote *</label>
          <select onchange="updComprobanteProductoEdit(${i},'loteId',this.value)" class="w-full px-2 py-1 border rounded text-sm" ${!it.productoId ? 'disabled' : ''}>
            <option value="">-</option>
            ${lotes.map(l => `<option value="${l.id}" ${it.loteId === l.id ? 'selected' : ''}>[${l.lote || 'S/L'}] Cant: ${l.cantidad}</option>`).join('')}
          </select>
        </div>` : `
        <div class="col-span-3">
          <label class="text-xs font-medium">Lote (nuevo)</label>
          <input type="text" value="${it.loteId}" onchange="updComprobanteProductoEdit(${i},'loteId',this.value)" class="w-full px-2 py-1 border rounded text-sm" placeholder="Ej: L-001">
        </div>`}
        <div class="col-span-1">
          <label class="text-xs font-medium">Cant. *</label>
          <input type="number" min="1" value="${it.cantidad}" onchange="updComprobanteProductoEdit(${i},'cantidad',this.value)" class="w-full px-2 py-1 border rounded text-sm">
        </div>
        <div class="col-span-2">
          <label class="text-xs font-medium">${esCliente ? 'Precio' : 'Costo'} *</label>
          <input type="number" step="0.01" value="${it.precioUnit}" onchange="updComprobanteProductoEdit(${i},'precioUnit',this.value)" class="w-full px-2 py-1 border rounded text-sm">
        </div>
        <div class="col-span-1 text-right">
          <button onclick="delComprobanteProductoEdit(${i})" class="text-red-500"><i class="fas fa-trash"></i></button>
        </div>
      </div>
    </div>`;
  }).join('') || '<p class="text-center text-slate-400 text-sm py-4">Sin productos</p>';
  
  updTotalProductosEdit();
}

function updComprobanteProductoEdit(i, k, v) {
  if (k === 'cantidad' || k === 'precioUnit') comprobanteItems[i][k] = parseFloat(v) || 0;
  else comprobanteItems[i][k] = v;
  
  if (k === 'productoId') {
    comprobanteItems[i].loteId = '';
    const p = state.productos.find(x => x.id === v);
    if (p) {
      comprobanteItems[i].precioUnit = p.precioLista || p.costo || 0;
      comprobanteItems[i].costoUnit = p.costo || 0;
    }
  }
  renderComprobanteProductosEdit();
}

function delComprobanteProductoEdit(i) {
  comprobanteItems.splice(i, 1);
  renderComprobanteProductosEdit();
}

function updTotalProductosEdit() {
  const total = comprobanteItems.reduce((s, it) => s + (it.cantidad * it.precioUnit), 0);
  const el = document.getElementById('totalProductosEdit');
  if (el) el.textContent = fmt(total);
}

async function guardarEdicionSimple(id) {
  const comp = state.cuentas.find(c => c.id === id);
  if (!comp) return;
  
  const form = document.getElementById('formEditarComp');
  if (!form) return;
  
  const data = {};
  form.querySelectorAll('[name]').forEach(i => { data[i.name] = i.value; });
  
  // Actualizar solo campos seguros
  comp.fecha = data.fecha;
  comp.vencimiento = data.vencimiento;
  comp.concepto = data.concepto;
  comp.observaciones = data.observaciones;

      fecha: data.fecha,
      vencimiento: data.vencimiento,

      observaciones: data.observaciones
    });

async function guardarEdicionCompleta(id) {
  const comp = state.cuentas.find(c => c.id === id);
  if (!comp) return;
  
  const form = document.getElementById('formEditarCompCompleto');
  if (!form) return;
  
  const data = {};
  form.querySelectorAll('[name]').forEach(i => { 
    if (i.type === 'checkbox') data[i.name] = i.checked;
    else data[i.name] = i.value;
  });
  
  const importeTotal = parseFloat(data.total) || 0;
  if (importeTotal <= 0) { toast('El total debe ser mayor a 0', 'error'); return; }
  
  const vaAlDebe = data.tipoMov === 'debe';
  const chkProductos = document.getElementById('chkConProductosEdit');
  const conProductos = chkProductos ? chkProductos.checked : false;
  
  // Actualizar todos los campos
  comp.fecha = data.fecha;
  comp.vencimiento = data.vencimiento;
  comp.tipoComprobante = data.tipoComprobante;
  comp.puntoVenta = data.puntoVenta;
  comp.numero = data.numero;
  comp.concepto = data.concepto;
  comp.neto = parseFloat(data.neto) || 0;
  comp.iva21 = parseFloat(data.iva21) || 0;
  comp.iva105 = parseFloat(data.iva105) || 0;
  comp.percepciones = parseFloat(data.percepciones) || 0;
  comp.otrosImp = parseFloat(data.otrosImp) || 0;
  comp.total = importeTotal;
  comp.debe = vaAlDebe ? importeTotal : 0;
  comp.haber = vaAlDebe ? 0 : importeTotal;
  comp.medio = data.medio;
  comp.observaciones = data.observaciones;
  comp.vaLibroIva = data.vaLibroIva === true;
  comp.tieneProductos = conProductos;
  
  if (dbMode === 'supabase') {
    await DB.update('cuentas_corrientes', id, {
      fecha: data.fecha,
      vencimiento: data.vencimiento,
      tipo_comprobante: data.tipoComprobante,
      punto_venta: data.puntoVenta,
      numero: data.numero,
      concepto: data.concepto,
      neto: comp.neto,
      iva21: comp.iva21,
      iva105: comp.iva105,
      percepciones: comp.percepciones,
      otros_imp: comp.otrosImp,
      total: importeTotal,
      debe: comp.debe,
      haber: comp.haber,
      medio: data.medio,
      observaciones: data.observaciones,
      va_libro_iva: comp.vaLibroIva,
      tiene_productos: conProductos
    });
  }
  
  // Procesar productos si se marcaron
  if (conProductos && comprobanteItems.length > 0) {
    const esCliente = comp.tipo === 'cliente';
    for (const it of comprobanteItems) {
      if (!it.productoId) continue;
      
      const producto = state.productos.find(p => p.id === it.productoId);
      if (!producto) continue;
      
      if (esCliente) {
        // CLIENTE: Salida de stock
        if (it.loteId) {
          const lote = state.stock.find(s => s.id === it.loteId);
          if (lote) {
            lote.cantidad -= it.cantidad;
            if (lote.cantidad <= 0) state.stock = state.stock.filter(s => s.id !== it.loteId);
            if (dbMode === 'supabase') {
              if (lote.cantidad > 0) await DB.update('stock_lotes', lote.id, { cantidad: lote.cantidad });
              else await DB.remove('stock_lotes', it.loteId);
            }
          }
        }
        const movInv = {
          id: uid(),
          tipo: 'salida',
          productoId: it.productoId,
          producto_id: it.productoId,
          cantidad: it.cantidad,
          costoUnit: producto.costo || 0,
          costo_unit: producto.costo || 0,
          lote: it.loteId ? (state.stock.find(s => s.id === it.loteId)?.lote || '') : '',
          fecha: data.fecha,
          motivo: `${data.tipoComprobante} ${data.numero} - ${data.concepto}`,
          refTipo: 'comprobante',
          refId: comp.id,
          usuario: currentUser?.email || 'Admin'
        };
        if (!state.movimientos) state.movimientos = [];
        state.movimientos.push(movInv);
        if (dbMode === 'supabase') await DB.insert('movimientos_inventario', movInv);
        
      } else {
        // PROVEEDOR: Entrada de stock
        const nuevoLote = {
          id: uid(),
          productoId: it.productoId,
          producto_id: it.productoId,
          cantidad: it.cantidad,
          costoUnit: it.precioUnit || producto.costo || 0,
          costo_unit: it.precioUnit || producto.costo || 0,
          lote: it.loteId || `L-${data.numero}-${Date.now().toString().slice(-4)}`,
          vencimiento: null,
          fecha: data.fecha,
          movimiento: 'compra_manual'
        };
        state.stock.push(nuevoLote);
        if (dbMode === 'supabase') await DB.insert('stock_lotes', nuevoLote);
        
        const movInv = {
          id: uid(),
          tipo: 'entrada',
          productoId: it.productoId,
          producto_id: it.productoId,
          cantidad: it.cantidad,
          costoUnit: it.precioUnit || producto.costo || 0,
          costo_unit: it.precioUnit || producto.costo || 0,
          lote: nuevoLote.lote,
          fecha: data.fecha,
          motivo: `${data.tipoComprobante} ${data.numero} - ${data.concepto}`,
          refTipo: 'comprobante',
          refId: comp.id,
          usuario: currentUser?.email || 'Admin'
        };
        if (!state.movimientos) state.movimientos = [];
        state.movimientos.push(movInv);
        if (dbMode === 'supabase') await DB.insert('movimientos_inventario', movInv);
      }
    }
  }
  
  saveLocal();
  closeModal();
  toast('Comprobante actualizado' + (conProductos ? ` con ${comprobanteItems.length} producto(s)` : ''));
  refreshCurrent();
}
async function anularYRecrearComprobante(id) {
  const comp = state.cuentas.find(c => c.id === id);
  if (!comp) { toast('Comprobante no encontrado', 'error'); return; }
  
  // 🔒 Validación defensiva
  if (comp.anulado) { toast('No se puede recrear un comprobante ya anulado', 'error'); return; }
 
  if (!confirm(`¿Anular este comprobante y abrir formulario para recrearlo?\n\nSe revertirán:\n- Movimientos de stock\n- Movimientos de Caja\n- Imputaciones`)) return;
  
  // 1. Revertir stock si tiene productos
  if (comp.tieneProductos) {
    const movsInv = (state.movimientos || []).filter(m => m.refId === id);
    for (const mov of movsInv) {
      if (mov.tipo === 'salida') {
        // Devolver stock
        const producto = state.productos.find(p => p.id === mov.productoId);
        const loteRevertido = {
          id: uid(), productoId: mov.productoId,
          cantidad: mov.cantidad, costoUnit: mov.costoUnit || producto?.costo || 0,
          lote: mov.lote || ('REV-' + id.substring(0,6)),
          vencimiento: mov.vencimiento || null, fecha: today(),
          movimiento: 'anulacion'
        };
        state.stock.push(loteRevertido);
        if (dbMode === 'supabase') await DB.insert('stock_lotes', loteRevertido);
      } else if (mov.tipo === 'entrada') {
        // Restar stock
        const lote = state.stock.find(s => s.lote === mov.lote && s.productoId === mov.productoId);
        if (lote) {
          lote.cantidad -= mov.cantidad;
          if (lote.cantidad <= 0) state.stock = state.stock.filter(s => s.id !== lote.id);
          if (dbMode === 'supabase') {
            if (lote.cantidad > 0) await DB.update('stock_lotes', lote.id, { cantidad: lote.cantidad });
            else await DB.remove('stock_lotes', lote.id);
          }
        }
      }
      mov.anulado = true;
      if (dbMode === 'supabase') await DB.update('movimientos_inventario', mov.id, { cantidad: 0 });
    }
  }
  
  // 2. Anular movimientos de caja vinculados
  const movsCaja = state.caja.filter(m => m.refId === id || (m.datosExtra && m.datosExtra.refComprobanteId === id));
  for (const mov of movsCaja) {
    mov.estado = 'anulado';
    if (dbMode === 'supabase') await DB.update('caja_movimientos', mov.id, { estado: 'anulado' });
  }
  
  // 3. Eliminar imputaciones
  const imps = state.cajaImputaciones.filter(i => i.comprobanteId === id);
  for (const imp of imps) {
    if (dbMode === 'supabase') await DB.remove('caja_imputaciones', imp.id);
  }
  state.cajaImputaciones = state.cajaImputaciones.filter(i => i.comprobanteId !== id);
  
  // 4. Marcar comprobante como anulado
  comp.anulado = true;
  comp.total = 0;
  comp.debe = 0;
  comp.haber = 0;
  if (dbMode === 'supabase') await DB.update('cuentas_corrientes', id, { total: 0, debe: 0, haber: 0 });
  
  saveLocal();
  toast('Comprobante anulado. Abriendo formulario para recrear...');
  
  // 5. Abrir formulario pre-cargado
  setTimeout(() => {
    formComprobanteManual(comp.tipo, comp.entityId);
    // Pre-cargar datos (excepto importe y productos)
    setTimeout(() => {
      const form = document.getElementById('formComprobante');
      if (form) {
        form.querySelector('[name=fecha]').value = comp.fecha;
        form.querySelector('[name=vencimiento]').value = comp.vencimiento || '';
        form.querySelector('[name=tipoComprobante]').value = comp.tipoComprobante;
        form.querySelector('[name=puntoVenta]').value = comp.puntoVenta || '0001';
        form.querySelector('[name=numero]').value = comp.numero || '';
        form.querySelector('[name=concepto]').value = comp.concepto || '';
        form.querySelector('[name=neto]').value = comp.neto || 0;
        form.querySelector('[name=iva21]').value = comp.iva21 || 0;
        form.querySelector('[name=iva105]').value = comp.iva105 || 0;
        form.querySelector('[name=percepciones]').value = comp.percepciones || 0;
        form.querySelector('[name=otrosImp]').value = comp.otrosImp || 0;
        form.querySelector('[name=total]').value = comp.total || 0;
        form.querySelector('[name=tipoMov]').value = comp.debe > 0 ? 'debe' : 'haber';
        form.querySelector('[name=medio]').value = comp.medio || 'Cuenta corriente';
        form.querySelector('[name=observaciones]').value = comp.observaciones || '';
        if (comp.vaLibroIva) {
          const chk = document.getElementById('chkLibroIva');
          if (chk) chk.checked = true;
        }
      }
    }, 100);
  }, 500);
}

async function anularComprobante(id) {
  const comp = state.cuentas.find(c => c.id === id);
  if (!comp) return;
  
  if (!confirm(`¿Anular este comprobante?\n\nEsta acción no se puede deshacer.`)) return;
  
  // Revertir stock si tiene productos
  if (comp.tieneProductos) {
    const movsInv = (state.movimientos || []).filter(m => m.refId === id);
    for (const mov of movsInv) {
      if (mov.tipo === 'salida') {
        const producto = state.productos.find(p => p.id === mov.productoId);
        const loteRevertido = {
          id: uid(), productoId: mov.productoId,
          cantidad: mov.cantidad, costoUnit: mov.costoUnit || producto?.costo || 0,
          lote: mov.lote || ('REV-' + id.substring(0,6)),
          vencimiento: mov.vencimiento || null, fecha: today(),
          movimiento: 'anulacion'
        };
        state.stock.push(loteRevertido);
        if (dbMode === 'supabase') await DB.insert('stock_lotes', loteRevertido);
      } else if (mov.tipo === 'entrada') {
        const lote = state.stock.find(s => s.lote === mov.lote && s.productoId === mov.productoId);
        if (lote) {
          lote.cantidad -= mov.cantidad;
          if (lote.cantidad <= 0) state.stock = state.stock.filter(s => s.id !== lote.id);
          if (dbMode === 'supabase') {
            if (lote.cantidad > 0) await DB.update('stock_lotes', lote.id, { cantidad: lote.cantidad });
            else await DB.remove('stock_lotes', lote.id);
          }
        }
      }
    }
  }
  
  // Anular movimientos de caja
  const movsCaja = state.caja.filter(m => m.refId === id || (m.datosExtra && m.datosExtra.refComprobanteId === id));
  for (const mov of movsCaja) {
    mov.estado = 'anulado';
    if (dbMode === 'supabase') await DB.update('caja_movimientos', mov.id, { estado: 'anulado' });
  }
  
  // Eliminar imputaciones
  const imps = state.cajaImputaciones.filter(i => i.comprobanteId === id);
  for (const imp of imps) {
    if (dbMode === 'supabase') await DB.remove('caja_imputaciones', imp.id);
  }
  state.cajaImputaciones = state.cajaImputaciones.filter(i => i.comprobanteId !== id);
  
  // Marcar como anulado
  comp.anulado = true;
  comp.total = 0;
  comp.debe = 0;
  comp.haber = 0;
  if (dbMode === 'supabase') await DB.update('cuentas_corrientes', id, { total: 0, debe: 0, haber: 0 });
  
  saveLocal();
  toast('Comprobante anulado');
  refreshCurrent();
}

function toast(msg, type='success') {
  const t = document.getElementById('toast');
  const icon = document.getElementById('toastIcon');
  document.getElementById('toastMsg').textContent = msg;
  icon.className = type==='success' ? 'fas fa-check-circle text-emerald-400' : type==='error' ? 'fas fa-times-circle text-red-400' : 'fas fa-info-circle text-blue-400';
  t.classList.remove('hidden');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.add('hidden'), 3000);
}
function openModal(title, html) { document.getElementById('modalTitle').textContent = title; document.getElementById('modalBody').innerHTML = html; document.getElementById('modal').classList.remove('hidden'); }
function closeModal() { document.getElementById('modal').classList.add('hidden'); }
function lbl(text, tooltip, required=false) { const req = required ? '<span class="req">*</span>' : ''; return `<div class="field-label tip-wrap">${text}${req}<span class="help-icon">?</span><span class="tip">${tooltip}</span></div>`; }
function getFormData(containerId, required=[]) {
  const c = document.getElementById(containerId);
  if (!c) { toast('Error: formulario no encontrado','error'); return null; }
  const data = {};
  c.querySelectorAll('[name]').forEach(i => { data[i.name] = i.type === 'checkbox' ? i.checked : i.value; });
  for (const r of required) {
    if (data[r] === undefined || data[r] === '' || data[r] === null) {
      const el = c.querySelector(`[name="${r}"]`);
      if (el) { el.classList.add('field-error'); el.focus(); setTimeout(()=>el.classList.remove('field-error'), 3000); }
      toast(`Campo "${r}" es obligatorio`, 'error');
      return null;
    }
  }
  return data;
}

function showLoginError(msg) { const el = document.getElementById('loginError'); el.textContent = msg; el.classList.remove('hidden'); }

async function handleAuth() {
  // 1. Normalizar el email (minúsculas y sin espacios al inicio/final)
  const emailRaw = document.getElementById('loginEmail').value;
  const email = emailRaw ? emailRaw.toLowerCase().trim() : '';
  const password = document.getElementById('loginPassword').value;
  
  if (!email || !password) { showLoginError('Complete email y contraseña'); return; }
  if (appUsers.length === 0) loadLocal();
  
  if (loginMode === 'signin') {
    // 2. Búsqueda robusta (ignora mayúsculas y espacios accidentales)
    let u = appUsers.find(x => x.email.toLowerCase().trim() === email && x.password === password);
    
    // 3. Fallback a Supabase Auth si no existe localmente
    if (!u && dbMode === 'supabase' && supabaseClient) {
      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email: emailRaw, password });
        if (!error && data.user) {
          // Verificar de nuevo con búsqueda robusta
          u = appUsers.find(x => x.email.toLowerCase().trim() === email);
          
          if (!u) {
            // SEGURIDAD: Eliminar cualquier duplicado previo antes de agregar el nuevo
            appUsers = appUsers.filter(x => x.email.toLowerCase().trim() !== email);
            
            u = {
              id: data.user.id,
              email: email,
              password: '(supabase-auth)',
              full_name: data.user.user_metadata?.full_name || email.split('@')[0],
              role: 'admin',
              activo: true,
              permisos: getDefaultPerms(),
              created_at: today(),
              isSupabaseAuth: true
            };
            appUsers.push(u);
            saveUsers();
            console.log('[handleAuth] Usuario sincronizado desde Supabase:', email);
          }
        }
      } catch (e) {
        console.warn('[handleAuth] Error Supabase Auth:', e);
      }
    }
    
    if (!u) { showLoginError('Credenciales incorrectas.'); return; }
    if (u.activo === false) { showLoginError('Usuario inactivo'); return; }
    
    currentUser = u;
    enterApp();
  } else {
    // Lógica de registro (Signup)
    const name = document.getElementById('signupName').value.trim() || email.split('@')[0];
    if (appUsers.find(x => x.email.toLowerCase().trim() === email)) {
      showLoginError('Email ya registrado'); return;
    }
    const nu = {
      id: uid(), email: email, password: password, full_name: name,
      role: 'admin', activo: true, permisos: getDefaultPerms(), created_at: today()
    };
    appUsers.push(nu);
    saveUsers();
    currentUser = nu;
    enterApp();
  }
}

function doLogout() {
  currentUser = null;
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';

function hasPermission(moduleId) {
  if (!currentUser) return false;
  if (currentUser.role === 'admin') return true;
  const mod = MODULES.find(m => m.id === moduleId);
  if (mod && mod.adminOnly) return false;
  return currentUser.permisos && currentUser.permisos[moduleId] === true;
}

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  if (!nav) return;
  const groups = {};
  MODULES.forEach(m => {
    if (!hasPermission(m.id)) return;
    if (!groups[m.group]) groups[m.group] = [];
    groups[m.group].push(m);
  });
  let html = '';
  for (const group in groups) {
    html += `<div class="px-4 mt-3 mb-1 text-xs text-slate-500 uppercase">${group}</div>`;
    groups[group].forEach(m => {
      const isActive = currentModule === m.id ? 'active' : '';
      html += `<a onclick="showModule('${m.id}')" class="sidebar-item ${isActive} flex items-center gap-3 px-5 py-2.5 cursor-pointer" data-module="${m.id}"><i class="fas ${m.icon} w-5"></i><span>${m.name}</span></a>`;
    });
  }
  nav.innerHTML = html;
}

async insert(table, record) {
  if (dbMode !== 'supabase') return { data: [record] };
  try {
    const transformer = toSupabase[table];
    const payload = transformer ? transformer(record) : record;
    Object.keys(payload).forEach(k => { if (payload[k] === undefined) delete payload[k]; });
    const { data, error } = await supabaseClient.from(table).insert([payload]).select();
    if (error) { console.error(`DB.insert [${table}] error:`, error); toast('Error BD: ' + error.message, 'error'); return { error }; }
    return { data };
  } catch(e) { console.error(`DB.insert [${table}] exception:`, e); return { error: e }; }
},


async update(table, id, changes) {
  if (dbMode !== 'supabase') return { data: [changes] };
  try {
    // Mapeo seguro de camelCase a snake_case SOLO para los campos que se están actualizando
    const keyMap = {
      entityId: 'entity_id', tipoComprobante: 'tipo_comprobante', puntoVenta: 'punto_venta',
      otrosImp: 'otros_imp', refTipo: 'ref_tipo', refId: 'ref_id', vaLibroIva: 'va_libro_iva',
      tieneProductos: 'tiene_productos', productoId: 'producto_id', costoUnit: 'costo_unit',
      medioPago: 'medio_pago', entidadTipo: 'entidad_tipo', entidadId: 'entidad_id',
      numeroRecibo: 'numero_recibo', datosExtra: 'datos_extra', movimientoId: 'movimiento_id',
      comprobanteId: 'comprobante_id', importeImputado: 'importe_imputado', tipoMov: 'tipo_mov'
    };
    
    const payload = {};
    Object.keys(changes).forEach(k => {
      const dbKey = keyMap[k] || k;
      payload[dbKey] = changes[k];
    });

    const { data, error } = await supabaseClient.from(table).update(payload).eq('id', id).select();
    if (error) { console.error(`DB.update [${table}] error:`, error); toast('Error BD: ' + error.message, 'error'); return { error }; }
    return { data };
  } catch(e) { console.error(`DB.update [${table}] exception:`, e); return { error: e }; }
},

  async remove(table, id) {
    if (dbMode !== 'supabase') return {};
    try {
      const { error } = await supabaseClient.from(table).delete().eq('id', id);
      if (error) { toast('Error BD: ' + error.message, 'error'); return { error }; }
      return {};
    } catch(e) { return { error: e }; }
  }
};

  state[key] = state[key].filter(x=>x.id!==id);
  const map = { clientes:'clientes', proveedores:'proveedores', vendedores:'vendedores', productos:'productos', listas:'listas_precios', compras:'compras', ventas:'ventas', stock:'stock_lotes', cuentas:'cuentas_corrientes', movimientos:'movimientos_inventario' };
  await DB.remove(map[key], id);
  saveLocal(); toast('Eliminado');
  refreshCurrent();
}

async function getNextReciboNumber(tipo = 'R', puntoVenta = '0001') {
  // 1. Buscar máximo local
  const movsLocales = state.caja.filter(m => m.numeroRecibo && m.numeroRecibo.startsWith(`${tipo}-${puntoVenta}-`));
  let maxNum = 0;
  movsLocales.forEach(m => {
    const partes = m.numeroRecibo.split('-');
    const num = parseInt(partes[2]) || 0;
    if (num > maxNum) maxNum = num;
  });

  // 2. Si hay conexión a Supabase, consultar el último registro en la nube
  if (dbMode === 'supabase' && supabaseClient) {
    try {
      const { data, error } = await supabaseClient
        .from('caja_movimientos')
        .select('numero_recibo')
        .like('numero_recibo', `${tipo}-${puntoVenta}-%`)
        .order('created_at', { ascending: false })
        .limit(1);
      
      if (!error && data && data.length > 0 && data[0].numero_recibo) {
        const partesNube = data[0].numero_recibo.split('-');
        const numNube = parseInt(partesNube[2]) || 0;
        maxNum = Math.max(maxNum, numNube);
      }
    } catch (e) {
      console.warn('Error consultando secuencia en Supabase:', e);
    }
  }

  return `${tipo}-${puntoVenta}-${(maxNum + 1).toString().padStart(8, '0')}`;


  // 2. Si hay conexión a Supabase, verificar el último registro en la nube
  if (dbMode === 'supabase' && supabaseClient) {
    try {
      const { data, error } = await supabaseClient
        .from('caja_movimientos')
        .select('numero_recibo')
        .like('numero_recibo', `${tipo}-${puntoVenta}-%`)
        .order('created_at', { ascending: false })
        .limit(1);
      
      if (!error && data && data.length > 0) {
        const partesNube = data[0].numero_recibo.split('-');
        const numNube = parseInt(partesNube[2]) || 0;
        return `${tipo}-${puntoVenta}-${(Math.max(maxNumLocal, numNube) + 1).toString().padStart(8, '0')}`;
      }
    } catch (e) {
      console.warn('Error verificando secuencia en Supabase:', e);
    }
  }

  // 3. Fallback a local si falla la nube o no hay conexión
  return `${tipo}-${puntoVenta}-${(maxNumLocal + 1).toString().padStart(8, '0')}`;
}

 function getCajaTotales(fechaDesde = null, fechaHasta = null) {
  const movs = state.caja.filter(m => {
    if (fechaDesde && m.fecha < fechaDesde) return false;
    if (fechaHasta && m.fecha > fechaHasta) return false;
    if (m.estado === 'anulado') return false;
    return true;
  });
  const tot = { ingresos: { efectivo: 0, cheque: 0, tarjeta: 0, transferencia: 0, total: 0 }, egresos: { efectivo: 0, cheque: 0, tarjeta: 0, transferencia: 0, total: 0 }, chequesEnCartera: 0 };
  movs.forEach(m => {
    const mp = m.medioPago || 'efectivo';
    const imp = parseFloat(m.importe) || 0;
    if (m.tipo === 'ingreso') {
      tot.ingresos[mp] = (tot.ingresos[mp] || 0) + imp;
      tot.ingresos.total += imp;
      if (mp === 'cheque' && m.estado === 'en_cartera') tot.chequesEnCartera += imp;
    } else {
      tot.egresos[mp] = (tot.egresos[mp] || 0) + imp;
      tot.egresos.total += imp;
    }
  });
  return tot;
}

 function getComprobantesPendientes(entityId, tipo) {
  return state.cuentas.filter(c => c.entityId === entityId && c.tipo === tipo).map(c => ({ ...c, saldoPendiente: (c.debe || 0) - (c.haber || 0) })).filter(c => c.saldoPendiente > 0.01).sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
}
function getTotalImputado(movimientoId) {
  return state.cajaImputaciones.filter(i => i.movimientoId === movimientoId).reduce((sum, i) => sum + (parseFloat(i.importeImputado) || 0), 0);
}
function actualizarEstadoMovimiento(movimientoId) {
  const mov = state.caja.find(m => m.id === movimientoId);
  if (!mov) return;
  const totalImp = getTotalImputado(movimientoId);
  const importe = parseFloat(mov.importe) || 0;
  if (totalImp <= 0) mov.estado = 'pendiente';
  else if (Math.abs(totalImp - importe) < 0.01) mov.estado = 'imputado_total';
  else mov.estado = 'imputado_parcial';
}

function onListaBaseChangeForm() {
  const base = document.getElementById('listaBase').value;
  document.getElementById('baseFields').classList.toggle('hidden', base !== 'lista');
  document.getElementById('preciosSection').classList.toggle('hidden', base !== 'manual');
}

function aplicarPrecioBaseATodos() {
  state.productos.forEach(p => {
    const input = document.querySelector(`[name="precio_${p.id}"]`);
    if (input) input.value = p.precioLista;
  });
}

async function saveLista(id) {
  const data = getFormData('formLista', ['nombre']);
  if (!data) return;
  
  data.porcentaje = parseFloat(data.porcentaje) || 0;
  if (!data.depende) data.depende = null;
  
  // Recopilar precios por producto (solo si es manual)
  const precios = {};
  if (data.base === 'manual') {
    state.productos.forEach(p => {
      const input = document.querySelector(`[name="precio_${p.id}"]`);
      if (input) {
        const val = parseFloat(input.value);
        if (!isNaN(val) && val >= 0) {
          precios[p.id] = val;
        }
      }
    });
  }
  data.precios = precios;
  
  let dbOk = true;
  if (id) {
    const idx = state.listas.findIndex(x => x.id === id);
    if (idx >= 0) state.listas[idx] = { ...state.listas[idx], ...data };
    const res = await DB.update('listas_precios', id, data);
    if (res.error) dbOk = false;
  } else {
    data.id = uid();
    state.listas.push(data);
    const res = await DB.insert('listas_precios', data);
    if (res.error) dbOk = false;
  }
  
  const nPrecios = Object.keys(precios).length;
  saveLocal(); closeModal();
  if (dbMode === 'supabase' && dbOk) toast(`Lista guardada en la nube ✓ (${nPrecios} precios)`);
  else if (dbMode === 'supabase') toast('Lista guardada SOLO local', 'error');
  else toast(`Lista guardada (${nPrecios} precios)`);
  refreshCurrent();
}

async function delLista(id) { if (!confirm('¿Eliminar?')) return; state.listas = state.listas.filter(x=>x.id!==id); await DB.remove('listas_precios', id); saveLocal(); toast('Lista eliminada'); refreshCurrent(); }

function updVentaLista() {
  const clienteId = document.getElementById('ventaCliente')?.value;
  // Recalcular precios de todos los items según la lista del nuevo cliente
  ventaItems.forEach((it, i) => {
    if (it.productoId) {
      it.precioUnit = getPrecioLista(it.productoId, clienteId);
    }
  });
  renderVentaItems();
}

function addItemVenta() { ventaItems.push({productoId:'',cantidad:1,precioUnit:0,descuento:0,loteId:''}); renderVentaItems(); }

function getPrecioLista(productoId, clienteId, listaForzada = null, visitadas = []) {
  const p = state.productos.find(x => x.id === productoId);
  if (!p) return 0;
  
  // Determinar qué lista usar
  let lista = listaForzada;
  if (!lista) {
    const c = state.clientes.find(x => x.id === clienteId);
    if (!c || !c.listaId) return p.precioLista || 0;
    lista = state.listas.find(l => l.id === c.listaId);
    if (!lista) return p.precioLista || 0;
  }
  
  // Protección contra bucles infinitos
  if (visitadas.includes(lista.id)) {
    console.warn('[getPrecioLista] Bucle detectado en lista:', lista.nombre);
    return p.precioLista || 0;
  }
  visitadas.push(lista.id);
  
  // LISTA MANUAL: usar precio específico del producto
  if (lista.base === 'manual') {
    if (lista.precios && lista.precios[productoId] !== undefined && 
        lista.precios[productoId] !== null && lista.precios[productoId] !== '') {
      const val = parseFloat(lista.precios[productoId]);
      if (!isNaN(val)) return val;
    }
    return p.precioLista || 0;
  }
  
  // LISTA DEPENDIENTE: calcular sobre la lista base + porcentaje
  if (lista.base === 'lista' && lista.depende) {
    const listaBase = state.listas.find(l => l.id === lista.depende);
    if (!listaBase) {
      console.warn('[getPrecioLista] Lista base no encontrada:', lista.depende);
      return p.precioLista || 0;
    }
    // Recursión pasando la lista base directamente (NO el clienteId)
    const precioBase = getPrecioLista(productoId, clienteId, listaBase, visitadas);
    const ajuste = parseFloat(lista.porcentaje) || 0;
    return precioBase * (1 + ajuste / 100);
  }
  
  return p.precioLista || 0;
}

function getLotesDisponibles(productoId) { return state.stock.filter(s=>s.productoId===productoId && s.cantidad>0).sort((a,b)=>(a.vencimiento||'9999').localeCompare(b.vencimiento||'9999')); }

  if (!c) return;
  const clienteId = document.getElementById('ventaCliente')?.value;
  const hoy = new Date();
  c.innerHTML = ventaItems.map((it,i)=>{
    const lotes = it.productoId ? getLotesDisponibles(it.productoId) : [];
    const loteSel = it.loteId ? state.stock.find(s=>s.id===it.loteId) : null;
    return `<div class="bg-slate-50 p-3 rounded-lg border">
      <div class="grid grid-cols-12 gap-2 items-end">
        <div class="col-span-3"><label class="text-xs font-medium">Producto *</label><select onchange="updVentaItem(${i},'productoId',this.value)" class="w-full px-2 py-1 border rounded text-sm"><option value="">-</option>${state.productos.map(p=>`<option value="${p.id}" ${it.productoId===p.id?'selected':''}>${p.nombre}</option>`).join('')}</select></div>
        <div class="col-span-3"><label class="text-xs font-medium">Lote *</label><select onchange="updVentaItem(${i},'loteId',this.value)" class="w-full px-2 py-1 border rounded text-sm" ${!it.productoId?'disabled':''}><option value="">-</option>${lotes.map(l=>{ const v = l.vencimiento?new Date(l.vencimiento):null; const vencido = v && v<hoy; const prox = v && !vencido && (v-hoy)/(1000*60*60*24) < 30; const tag = vencido?'[VENC]':prox?'[PRÓX]':''; return `<option value="${l.id}" ${it.loteId===l.id?'selected':''}>${tag} [${l.lote||'S/L'}] Cant:${l.cantidad}</option>`; }).join('')}</select></div>
        <div class="col-span-1"><label class="text-xs font-medium">Cant.</label><input type="number" min="1" max="${loteSel?loteSel.cantidad:9999}" value="${it.cantidad}" onchange="updVentaItem(${i},'cantidad',this.value)" class="w-full px-2 py-1 border rounded text-sm"></div>
        <div class="col-span-2"><label class="text-xs font-medium">Precio</label><input type="number" step="0.01" value="${it.precioUnit}" onchange="updVentaItem(${i},'precioUnit',this.value)" class="w-full px-2 py-1 border rounded text-sm"></div>
        <div class="col-span-1"><label class="text-xs font-medium">Desc%</label><input type="number" step="0.01" value="${it.descuento}" onchange="updVentaItem(${i},'descuento',this.value)" class="w-full px-2 py-1 border rounded text-sm"></div>
        <div class="col-span-1 text-right"><button onclick="delVentaItem(${i})" class="text-red-500"><i class="fas fa-trash"></i></button></div>
      </div>
      ${loteSel ? `<div class="mt-2 text-xs text-slate-600 flex gap-3 flex-wrap"><span><i class="fas fa-box"></i> <b>${loteSel.lote||'S/L'}</b></span><span><i class="fas fa-calendar"></i> ${loteSel.vencimiento||'-'}</span><span><i class="fas fa-dollar-sign"></i> ${fmt(loteSel.costoUnit)}</span><span><i class="fas fa-cubes"></i> Disp: <b class="${loteSel.cantidad<it.cantidad?'text-red-600':'text-emerald-600'}">${loteSel.cantidad}</b></span></div>` : (it.productoId && lotes.length===0 ? '<div class="mt-2 text-xs text-red-600"><i class="fas fa-exclamation-triangle"></i> Sin stock</div>' : '')}
    </div>`;
  }).join('') || '<p class="text-center text-slate-400 text-sm py-4">Sin items</p>';
  updVentaTotal();
}

function updVentaItem(i, k, v) {
  if (k === 'cantidad' || k === 'precioUnit' || k === 'descuento') {
    ventaItems[i][k] = parseFloat(v) || 0;
  } else {
    ventaItems[i][k] = v;
  }
  
  if (k === 'productoId') {
    ventaItems[i].loteId = '';
    const clienteId = document.getElementById('ventaCliente')?.value;
    const precioCalculado = getPrecioLista(v, clienteId);
    
    // Si el precio calculado es 0, usar el precio base del producto como fallback
    if (precioCalculado <= 0) {
      const producto = state.productos.find(p => p.id === v);
      ventaItems[i].precioUnit = producto?.precioLista || 0;
      console.warn(`[updVentaItem] Precio lista = 0 para producto ${producto?.nombre}, usando precio base: ${ventaItems[i].precioUnit}`);
    } else {
      ventaItems[i].precioUnit = precioCalculado;
    }
  }
  
  renderVentaItems();
}

function updVentaTotal() {
  const total = ventaItems.reduce((s, it) => {
    const cant = parseFloat(it.cantidad) || 0;
    const precio = parseFloat(it.precioUnit) || 0;
    const desc = parseFloat(it.descuento) || 0;
    const subtotal = cant * precio * (1 - desc / 100);
    return s + subtotal;
  }, 0);
  
  const el = document.getElementById('ventaTotal');
  if (el) {
    el.textContent = fmt(total);
    console.log('[updVentaTotal] Total calculado:', total, '| Items:', ventaItems.length);
  } else {
    console.warn('[updVentaTotal] Elemento #ventaTotal no encontrado');
  }
}

function delVentaItem(i) { ventaItems.splice(i,1); renderVentaItems(); }

function updVentaItem(i, k, v) {
  if (k === 'cantidad' || k === 'precioUnit' || k === 'descuento') ventaItems[i][k] = parseFloat(v) || 0;
  else ventaItems[i][k] = v;
  if (k === 'productoId') {
    ventaItems[i].loteId = '';
    const clienteId = document.getElementById('ventaCliente')?.value;
    ventaItems[i].precioUnit = getPrecioLista(v, clienteId);
  }
  renderVentaItems();
}

async function saveVenta() {
  try {
    const data = getFormData('formVenta', ['fecha','clienteId','tipoComprobante']);
    if (!data) return;
    if (ventaItems.length === 0) { toast('Agregue items','error'); return; }
    for (const it of ventaItems) {
      if (!it.productoId) { toast('Items sin producto','error'); return; }
      if (!it.loteId) { toast(`Seleccione lote para ${state.productos.find(p=>p.id===it.productoId)?.nombre}`,'error'); return; }
      const lote = state.stock.find(s=>s.id===it.loteId);
      if (!lote || lote.cantidad < it.cantidad) { toast(`Stock insuficiente en lote ${lote?.lote}`,'error'); return; }
    }
    const venta = {
      id: uid(),
      fecha: data.fecha,
      numero: data.numero,
      tipoComprobante: data.tipoComprobante || 'Factura B',
      puntoVenta: '0001',
      vencimiento: data.vencimiento || null,
      clienteId: data.clienteId,
      vendedorId: data.vendedorId || null,
      items: [...ventaItems],
      total: ventaItems.reduce((s,it)=>s+it.cantidad*it.precioUnit*(1-it.descuento/100),0)
    };
    state.ventas.push(venta);
    if (dbMode === 'supabase') await DB.insert('ventas', venta);
    for (const it of venta.items) {
      const lote = state.stock.find(s=>s.id===it.loteId);
      if (lote) {
        lote.cantidad -= it.cantidad;
        if (dbMode === 'supabase') await DB.update('stock_lotes', lote.id, { cantidad: lote.cantidad });
      }
    }
    state.stock = state.stock.filter(s=>s.cantidad > 0);
    if (venta.clienteId) {
      const mov = { id: uid(), tipo: 'cliente', entityId: venta.clienteId, fecha: venta.fecha, concepto: `${venta.tipoComprobante} ${venta.numero}`, debe:       venta.total, haber: 0, refTipo: 'venta', refId: venta.id, tipoComprobante: venta.tipoComprobante, puntoVenta: venta.puntoVenta, numero: venta.numero,       total: venta.total, medio: 'Cuenta corriente' };
      state.cuentas.push({ ...mov });
      if (dbMode === 'supabase') await DB.insert('cuentas_corrientes', mov);
    }
    saveLocal(); closeModal();
    const esPresupuesto = venta.tipoComprobante === 'Presupuesto';
    if (esPresupuesto) {
      if (confirm('✅ Venta (Presupuesto) registrada.\n\n¿Desea imprimir el presupuesto ahora?')) {
        setTimeout(() => imprimirComprobante('venta', venta.id), 300);
      } else {
        toast('Presupuesto registrado');
      }
    } else {
      toast('Venta registrada');
    }
    refreshCurrent();
  } catch (error) {
    console.error('[saveVenta] Error:', error);
    toast('Error al guardar venta: ' + error.message, 'error');
  }
}

function verFichaProducto(productoId) {
  const p = state.productos.find(x => x.id === productoId);
  if (!p) { toast('Producto no encontrado','error'); return; }
  
  // Recopilar todos los movimientos del producto ordenados por fecha
  const movimientos = [];
  
  // 1. Entradas manuales
  (state.movimientos||[]).filter(m => m.productoId === productoId && m.tipo === 'entrada' && !m.anulado).forEach(m => {
    movimientos.push({ fecha: m.fecha, tipo: 'Entrada manual', detalle: `Lote ${m.lote||'S/L'} · ${m.motivo||'-'}`, entrada: m.cantidad, salida: 0, ref: m.id, refTipo: 'mov' });
  });
  
  // 2. Salidas manuales
  (state.movimientos||[]).filter(m => m.productoId === productoId && m.tipo === 'salida' && !m.anulado).forEach(m => {
    movimientos.push({ fecha: m.fecha, tipo: 'Salida manual', detalle: `Lote ${m.lote||'S/L'} · ${m.motivo||'-'}`, entrada: 0, salida: m.cantidad, ref: m.id, refTipo: 'mov' });
  });
  
  // 3. Correcciones
  (state.movimientos||[]).filter(m => m.productoId === productoId && m.tipo === 'correccion' && !m.anulado).forEach(m => {
    const esEntrada = m.cantidad > 0;
    movimientos.push({ fecha: m.fecha, tipo: 'Corrección', detalle: `Lote ${m.lote||'S/L'} · ${m.motivo||'-'}`, entrada: esEntrada ? m.cantidad : 0, salida: esEntrada ? 0 : Math.abs(m.cantidad), ref: m.id, refTipo: 'mov' });
  });
  
  // 4. Compras (entradas)
  state.compras.filter(c => c.items && c.items.some(it => it.productoId === productoId)).forEach(c => {
    c.items.filter(it => it.productoId === productoId).forEach(it => {
      movimientos.push({ fecha: c.fecha, tipo: 'Compra', detalle: `${c.numero} · Lote ${it.lote||'-'}`, entrada: it.cantidad, salida: 0, ref: c.id, refTipo: 'compra' });
    });
  });
  
  // 5. Ventas (salidas)
  state.ventas.filter(v => v.items && v.items.some(it => it.productoId === productoId)).forEach(v => {
    v.items.filter(it => it.productoId === productoId).forEach(it => {
      movimientos.push({ fecha: v.fecha, tipo: 'Venta', detalle: `${v.numero} · Lote ${it.loteId?.substring(0,8)||'-'}`, entrada: 0, salida: it.cantidad, ref: v.id, refTipo: 'venta' });
    });
  });
  
  // Ordenar por fecha ascendente
  movimientos.sort((a,b) => (a.fecha||'').localeCompare(b.fecha||''));
  
  // Calcular saldos acumulados
  let saldo = 0;
  const filas = movimientos.map(m => {
    saldo += m.entrada - m.salida;
    return { ...m, saldo };
  });
  
  // Filtros
  const hoy = today();
  openModal(`Ficha de Producto: ${p.nombre}`, `
    <div class="space-y-4">
      <div class="bg-slate-50 border rounded-lg p-4">
        <div class="grid grid-cols-4 gap-3 text-sm">
          <div><b class="text-slate-500">Código:</b> <span class="font-mono">${p.codigo}</span></div>
          <div><b class="text-slate-500">Categoría:</b> ${p.categoria||'-'}</div>
          <div><b class="text-slate-500">Unidad:</b> ${p.unidad||'-'}</div>
          <div><b class="text-slate-500">Stock mínimo:</b> ${p.stockMin}</div>
          <div><b class="text-slate-500">Costo:</b> ${fmt(p.costo)}</div>
          <div><b class="text-slate-500">Precio Lista:</b> ${fmt(p.precioLista)}</div>
          <div><b class="text-slate-500">Stock actual:</b> <span class="font-bold ${saldo<p.stockMin?'text-red-600':'text-emerald-600'}">${saldo} ${p.unidad||''}</span></div>
          <div><b class="text-slate-500">Valor stock:</b> ${fmt(saldo * p.costo)}</div>
        </div>
      </div>
      
      <div class="flex items-center gap-3 bg-blue-50 border border-blue-200 rounded-lg p-3">
        <label class="text-sm font-medium">Desde:</label>
        <input type="date" id="kardexDesde" value="${hoy.substring(0,7)}-01" class="px-3 py-1 border rounded">
        <label class="text-sm font-medium">Hasta:</label>
        <input type="date" id="kardexHasta" value="${hoy}" class="px-3 py-1 border rounded">
        <button onclick="filtrarKardex('${productoId}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm"><i class="fas fa-filter mr-1"></i>Filtrar</button>
        <button onclick="imprimirKardex('${productoId}')" class="bg-slate-600 hover:bg-slate-700 text-white px-3 py-1 rounded text-sm"><i class="fas fa-print mr-1"></i>Imprimir</button>
      </div>
     
      <div id="kardexBody">
        <table class="w-full text-sm border">
          <thead class="bg-slate-50 text-xs uppercase text-slate-600">
            <tr>
              <th class="p-2 text-left">Fecha</th>
              <th class="p-2 text-left">Tipo</th>
              <th class="p-2 text-left">Detalle</th>
              <th class="p-2 text-right">Entrada</th>
              <th class="p-2 text-right">Salida</th>
              <th class="p-2 text-right">Saldo</th>
              <th class="p-2 text-center">Acción</th>
            </tr>
          </thead>
          <tbody>
            ${filas.length === 0 ? '<tr><td colspan="7" class="p-4 text-center text-slate-400">Sin movimientos</td></tr>' : 
              filas.map(f => `
                <tr class="border-t table-row">
                  <td class="p-2">${fmtDate(f.fecha)}</td>
                  <td class="p-2"><span class="badge ${f.tipo==='Entrada manual'||f.tipo==='Compra'?'badge-success':f.tipo==='Venta'||f.tipo==='Salida manual'?'badge-danger':'badge-info'}">${f.tipo}</span></td>

                  <td class="p-2 text-right font-bold">${f.saldo}</td>
                  <td class="p-2 text-center">
                    ${f.refTipo==='mov'?`<button onclick="anularMovimientoManual('${f.ref}'); closeModal(); setTimeout(()=>verFichaProducto('${productoId}'),500);" class="text-red-600 text-xs" title="Anular"><i class="fas fa-ban"></i></button>`:''}

              <td class="p-2 text-right">${saldo}</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  `);

async function saveEntradaManual() {
  try {
    const data = getFormData('formEntrada', ['fecha','productoId','cantidad','lote']);
    if (!data) return;
    const cant = parseInt(data.cantidad)||0;
    const costo = parseFloat(data.costoUnit)||0;
    
    // 1. Crear lote en stock
    const lote = { 
      id: uid(), 
      productoId: data.productoId,
      producto_id: data.productoId,
      cantidad: cant, 
      costoUnit: costo,
      costo_unit: costo,
      lote: data.lote, 
      vencimiento: data.vencimiento, 
      fecha: data.fecha, 
      movimiento: 'entrada_manual' 
    };
    state.stock.push({ ...lote });
    
    // 2. Guardar lote en Supabase
    if (dbMode === 'supabase') {
      const resLote = await DB.insert('stock_lotes', lote);
      if (resLote.error) {
        console.error('[saveEntradaManual] Error guardando lote:', resLote.error);
        toast('Error al guardar lote en la nube', 'error');
        state.stock.pop(); // Revertir
        return;
      }
    }
    
    // 3. Crear movimiento de inventario
    const mov = { 
      id: uid(), 
      tipo: 'entrada', 
      productoId: data.productoId,
      producto_id: data.productoId,
      cantidad: cant, 
      costoUnit: costo,
      costo_unit: costo,
      lote: data.lote, 
      vencimiento: data.vencimiento, 
      fecha: data.fecha, 
      motivo: data.motivo, 
      usuario: currentUser?.email || 'Admin' 
    };
    if (!state.movimientos) state.movimientos = [];
    state.movimientos.push({ ...mov });
    
    // 4. Guardar movimiento en Supabase
    if (dbMode === 'supabase') {
      const resMov = await DB.insert('movimientos_inventario', mov);
      if (resMov.error) {
        console.error('[saveEntradaManual] Error guardando movimiento:', resMov.error);
        toast('Error al guardar movimiento en la nube', 'error');
        state.movimientos.pop(); // Revertir
        return;
      }
    }
    
    saveLocal(); 
    closeModal(); 
    toast('Entrada registrada' + (dbMode === 'supabase' ? ' en la nube ✓' : '')); 
    refreshCurrent();
  } catch (error) {
    console.error('[saveEntradaManual] Error:', error);
    toast('Error: ' + error.message, 'error');
  }
}

  const cont = document.getElementById('salidaLotesList');

async function saveSalidaManual() {

    const data = getFormData('formSalida', ['fecha','productoId','loteId','cantidad','motivo']);
    if (!data) return;
    const loteId = data.loteId;
    const cant = parseInt(data.cantidad)||0;
    const lote = state.stock.find(s=>s.id===loteId);
    if (!lote || lote.cantidad < cant) { toast('Stock insuficiente','error'); return; }
    
    // 1. Actualizar stock local
    lote.cantidad -= cant;
    if (lote.cantidad <= 0) state.stock = state.stock.filter(s=>s.id!==loteId);
    
    // 2. Actualizar stock en Supabase
    if (dbMode === 'supabase') {

      id: uid(), 
      tipo: 'salida', 
      productoId: lote.productoId,
      producto_id: lote.productoId,
      cantidad: cant, 
      lote: lote.lote, 
      fecha: data.fecha, 
      motivo: data.motivo,

async function anularMovimientoManual(movId) {
  const mov = state.movimientos.find(m => m.id === movId);
  if (!mov) { toast('Movimiento no encontrado','error'); return; }
  if (!confirm(`¿Anular este movimiento ${mov.tipo==='entrada'?'de entrada':'de salida'}?\n\nSe revertirá el efecto en el stock.`)) return;
  
  const lote = state.stock.find(s => s.id === movId || (s.lote === mov.lote && s.productoId === mov.productoId));
  
  if (mov.tipo === 'entrada') {
    // Revertir: restar la cantidad que se había sumado
    if (lote) {
      lote.cantidad -= mov.cantidad;
      if (lote.cantidad <= 0) state.stock = state.stock.filter(s => s.id !== lote.id);
      if (dbMode === 'supabase') {
        if (lote.cantidad > 0) await DB.update('stock_lotes', lote.id, { cantidad: lote.cantidad });
        else await DB.remove('stock_lotes', lote.id);
      }
    }
    // Marcar como anulado (no borramos, preservamos trazabilidad)
    mov.anulado = true;
    mov.cantidad = 0;
    if (dbMode === 'supabase') await DB.update('movimientos_inventario', movId, { cantidad: 0 });
    toast('Movimiento de entrada anulado y stock revertido');
  } else if (mov.tipo === 'salida') {
    // Revertir: sumar la cantidad que se había restado
    const producto = state.productos.find(p => p.id === mov.productoId);
    const loteRevertido = {
      id: uid(), productoId: mov.productoId,
      cantidad: mov.cantidad, costoUnit: mov.costoUnit || producto?.costo || 0,
      lote: mov.lote || ('REV-'+movId.substring(0,6)),
      vencimiento: mov.vencimiento || null, fecha: today(),
      movimiento: 'anulacion'
    };
    state.stock.push(loteRevertido);
    if (dbMode === 'supabase') await DB.insert('stock_lotes', loteRevertido);
    mov.anulado = true;
    mov.cantidad = 0;
    if (dbMode === 'supabase') await DB.update('movimientos_inventario', movId, { cantidad: 0 });
    toast('Movimiento de salida anulado y stock restaurado');
  }
  
  saveLocal();
  refreshCurrent();
}

async function guardarEdicionMovimiento(movId) {
  const mov = state.movimientos.find(m => m.id === movId);
  if (!mov) return;
  const nuevaCant = parseInt(document.getElementById('editMovCantidad').value);
  const nuevoMotivo = document.getElementById('editMovMotivo').value;
  if (isNaN(nuevaCant) || nuevaCant < 0) { toast('Cantidad inválida','error'); return; }
  
  const diff = nuevaCant - mov.cantidad;
  const lote = state.stock.find(s => s.lote === mov.lote && s.productoId === mov.productoId);
  
  if (mov.tipo === 'entrada') {
    // Si aumento la entrada, sumo al lote; si disminuyo, resto
    if (lote) {
      lote.cantidad += diff;
      if (lote.cantidad <= 0) state.stock = state.stock.filter(s => s.id !== lote.id);
      if (dbMode === 'supabase') {
        if (lote.cantidad > 0) await DB.update('stock_lotes', lote.id, { cantidad: lote.cantidad });
        else await DB.remove('stock_lotes', lote.id);
      }
    }
  } else if (mov.tipo === 'salida') {
    // Si aumento la salida, resto más del lote; si disminuyo, devuelvo al lote
    if (lote) {
      lote.cantidad -= diff;
      if (lote.cantidad < 0) { toast('Stock insuficiente para aplicar el cambio','error'); return; }
      if (dbMode === 'supabase') await DB.update('stock_lotes', lote.id, { cantidad: lote.cantidad });
    } else if (diff < 0) {
      // Estamos reduciendo una salida pero no existe el lote, lo recreamos
      const producto = state.productos.find(p => p.id === mov.productoId);
      const nuevoLote = {
        id: uid(), productoId: mov.productoId,
        cantidad: -diff, costoUnit: mov.costoUnit || producto?.costo || 0,
        lote: mov.lote || ('EDIT-'+movId.substring(0,6)),
        vencimiento: mov.vencimiento || null, fecha: today(), movimiento: 'edicion'
      };
      state.stock.push(nuevoLote);
      if (dbMode === 'supabase') await DB.insert('stock_lotes', nuevoLote);
    }
  }
  
  mov.cantidad = nuevaCant;
  mov.motivo = nuevoMotivo;
  if (dbMode === 'supabase') await DB.update('movimientos_inventario', movId, { cantidad: nuevaCant, motivo: nuevoMotivo });
  
  saveLocal(); closeModal();
  toast('Movimiento actualizado');
  refreshCurrent();
}

async function saveCorreccion() {

    if (lote.cantidad <= 0) state.stock = state.stock.filter(s=>s.id!==loteId);
    
    // 2. Actualizar stock en Supabase

                     <button onclick="anularComprobante('${m.id}')" class="text-red-600 mx-1" title="Anular"><i class="fas fa-ban"></i></button>
                   </td>`;
              
              return `<tr class="border-t table-row" style="${estiloFila}">
                <td class="p-3" style="${tachado}">${fmtDate(m.fecha)}</td>
                <td class="p-3" style="${tachado}">${m.vencimiento ? fmtDate(m.vencimiento) : '-'}</td>

                <td class="p-3 font-mono text-xs" style="${tachado}">
                  ${m.tipoComprobante || ''} ${m.puntoVenta || ''}-${m.numero || '-'}
                  ${badgeAnulado}
                </td>
                <td class="p-3 text-slate-600 text-xs" style="${tachado}">${m.concepto || '-'}</td>
                <td class="p-3 text-right ${m.debe > 0 ? 'text-red-600 font-semibold' : ''}" style="${tachado}">${m.debe > 0 ? fmt(m.debe) : ''}</td>
                <td class="p-3 text-right ${m.haber > 0 ? 'text-emerald-600 font-semibold' : ''}" style="${tachado}">${m.haber > 0 ? fmt(m.haber) : ''}</td>

}

function verFicha(eId, tipo) {
  console.log('[verFicha] Iniciando - ID:', eId, 'Tipo:', tipo);
  
  try {
    const entidad = tipo === 'cliente' ? getCliente(eId) : getProveedor(eId);

    if (!entidad) {
      toast('Entidad no encontrada', 'error');
      return;

    const movs = state.cuentas.filter(c => c.entityId === eId && c.tipo === tipo).sort((a,b) => (a.fecha||'').localeCompare(b.fecha||''));
    console.log('[verFicha] Movimientos:', movs.length);
    
    let saldo = 0;

    openModal(`Ficha - ${entidad.razonSocial || ''}`, `

        </div>
      </div>
      <table class="w-full text-sm border">
        <thead class="bg-slate-50 text-xs uppercase text-slate-600">
          <tr>
            <th class="p-2 text-left">Fecha</th>
            <th class="p-2 text-left">Comprobante</th>
            <th class="p-2 text-left">Concepto</th>
            <th class="p-2 text-right">Debe</th>
            <th class="p-2 text-right">Haber</th>

        </thead>
        <tbody>
          ${filas.length === 0 ? '<tr><td colspan="6" class="p-4 text-center text-slate-400">Sin movimientos</td></tr>' :
            filas.map(m => `
              <tr class="border-t">
                <td class="p-2">${fmtDate(m.fecha)}</td>
                <td class="p-2 font-mono text-xs">${m.tipoComprobante || ''} ${m.puntoVenta || ''}-${m.numero || '-'}</td>

  }

  if (desc) {
    desc.textContent = tipo === 'cliente' 
      ? 'Los productos saldrán del stock (egreso).' 
      : 'Los productos ingresarán al stock (ingreso).';

}

function toggleProductosSection() {
  const chk = document.getElementById('chkConProductos');
  const section = document.getElementById('productosSection');
  if (chk && section) {
    section.classList.toggle('hidden', !chk.checked);
    if (chk.checked && comprobanteItems.length === 0) {
      addComprobanteProducto();
    }
  }
}

function addComprobanteProducto() {
  const tipo = document.getElementById('compTipo')?.value;
  comprobanteItems.push({
    productoId: '',
    cantidad: 1,
    precioUnit: 0,
    loteId: '',
    costoUnit: 0
  });
  renderComprobanteProductos();
}

function renderComprobanteProductos() {
  const c = document.getElementById('comprobanteProductosList');
  if (!c) return;
  const tipo = document.getElementById('compTipo')?.value;
  const esCliente = tipo === 'cliente';
  
  c.innerHTML = comprobanteItems.map((it, i) => {
    const productos = esCliente 
      ? state.productos 
      : state.productos;
    const lotes = it.productoId 
      ? state.stock.filter(s => s.productoId === it.productoId && s.cantidad > 0)
      : [];
    
    return `<div class="bg-slate-50 p-3 rounded-lg border">
      <div class="grid grid-cols-12 gap-2 items-end">
        <div class="col-span-4">
          <label class="text-xs font-medium">Producto *</label>
          <select onchange="updComprobanteProducto(${i},'productoId',this.value)" class="w-full px-2 py-1 border rounded text-sm">
            <option value="">-</option>
            ${productos.map(p => `<option value="${p.id}" ${it.productoId === p.id ? 'selected' : ''}>${p.nombre}</option>`).join('')}
          </select>
        </div>
        ${esCliente ? `
        <div class="col-span-3">
          <label class="text-xs font-medium">Lote *</label>
          <select onchange="updComprobanteProducto(${i},'loteId',this.value)" class="w-full px-2 py-1 border rounded text-sm" ${!it.productoId ? 'disabled' : ''}>
            <option value="">-</option>
            ${lotes.map(l => `<option value="${l.id}" ${it.loteId === l.id ? 'selected' : ''}>[${l.lote || 'S/L'}] Cant: ${l.cantidad}</option>`).join('')}
          </select>
        </div>` : `
        <div class="col-span-3">
          <label class="text-xs font-medium">Lote (nuevo)</label>
          <input type="text" value="${it.loteId}" onchange="updComprobanteProducto(${i},'loteId',this.value)" class="w-full px-2 py-1 border rounded text-sm" placeholder="Ej: L-001">
        </div>`}
        <div class="col-span-1">
          <label class="text-xs font-medium">Cant. *</label>
          <input type="number" min="1" value="${it.cantidad}" onchange="updComprobanteProducto(${i},'cantidad',this.value)" class="w-full px-2 py-1 border rounded text-sm">
        </div>
        <div class="col-span-2">
          <label class="text-xs font-medium">${esCliente ? 'Precio' : 'Costo'} *</label>
          <input type="number" step="0.01" value="${it.precioUnit}" onchange="updComprobanteProducto(${i},'precioUnit',this.value)" class="w-full px-2 py-1 border rounded text-sm">
        </div>
        <div class="col-span-1 text-right">
          <button onclick="delComprobanteProducto(${i})" class="text-red-500"><i class="fas fa-trash"></i></button>
        </div>
      </div>
    </div>`;
  }).join('') || '<p class="text-center text-slate-400 text-sm py-4">Sin productos</p>';
  
  updTotalProductosComprobante();
}

function updComprobanteProducto(i, k, v) {
  if (k === 'cantidad' || k === 'precioUnit') comprobanteItems[i][k] = parseFloat(v) || 0;
  else comprobanteItems[i][k] = v;
  
  if (k === 'productoId') {
    comprobanteItems[i].loteId = '';
    const p = state.productos.find(x => x.id === v);
    if (p) {
      comprobanteItems[i].precioUnit = p.precioLista || p.costo || 0;
      comprobanteItems[i].costoUnit = p.costo || 0;
    }
  }
  renderComprobanteProductos();
}

function delComprobanteProducto(i) {
  comprobanteItems.splice(i, 1);
  renderComprobanteProductos();
}

function updTotalProductosComprobante() {
  const total = comprobanteItems.reduce((s, it) => s + (it.cantidad * it.precioUnit), 0);
  const el = document.getElementById('totalProductosComprobante');
