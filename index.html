function calcComprobante() { const c = document.getElementById('formComprobante'); if (!c) return; const neto = parseFloat(c.querySelector('[name=neto]').value)||0; const iva21 = parseFloat(c.querySelector('[name=iva21]').value)||0; const iva105 = parseFloat(c.querySelector('[name=iva105]').value)||0; const perc = parseFloat(c.querySelector('[name=percepciones]').value)||0; const otros = parseFloat(c.querySelector('[name=otrosImp]').value)||0; const total = neto + iva21 + iva105 + perc + otros; c.querySelector('[name=total]').value = total.toFixed(2); }
   
async function saveComprobanteManual() {
  try {
    const data = getFormData('formComprobante', ['entityId', 'fecha', 'numero', 'concepto', 'total', 'tipoMov']);
    if (!data) return;
    
    const importeTotal = parseFloat(data.total) || 0;
    if (importeTotal <= 0) { toast('El total debe ser mayor a 0', 'error'); return; }

    const vaAlDebe = data.tipoMov === 'debe';
    const vaLibroIva = document.getElementById('chkLibroIva')?.checked || false;
    const conProductos = document.getElementById('chkConProductos')?.checked || false;
    const esCliente = data.tipo === 'cliente';
    
    // 1. Crear registro en Cuentas Corrientes
    const movCC = {
      id: uid(),
      tipo: data.tipo,
      entityId: data.entityId,
      fecha: data.fecha,
      vencimiento: data.vencimiento,
      tipoComprobante: data.tipoComprobante,
      puntoVenta: data.puntoVenta,
      numero: data.numero,
      concepto: data.concepto,
      neto: parseFloat(data.neto) || 0,
      iva21: parseFloat(data.iva21) || 0,
      iva105: parseFloat(data.iva105) || 0,
      percepciones: parseFloat(data.percepciones) || 0,
      otrosImp: parseFloat(data.otrosImp) || 0,
      total: importeTotal,
      debe: vaAlDebe ? importeTotal : 0,
      haber: vaAlDebe ? 0 : importeTotal,
      medio: data.medio,
      observaciones: data.observaciones,
      refTipo: 'manual',
      vaLibroIva: vaLibroIva,
      tieneProductos: conProductos,
      usuario: currentUser?.email || 'Admin'
    };

    state.cuentas.push(movCC);
    if (dbMode === 'supabase') await DB.insert('cuentas_corrientes', movCC);

    // 2. Procesar productos si está marcado
    if (conProductos && comprobanteItems.length > 0) {
      for (const it of comprobanteItems) {
        if (!it.productoId) continue;
        
        const producto = state.productos.find(p => p.id === it.productoId);
        if (!producto) continue;
        
        if (esCliente) {
          // CLIENTE: Salida de stock (egreso)
          if (it.loteId) {
            const lote = state.stock.find(s => s.id === it.loteId);
            if (lote) {
              lote.cantidad -= it.cantidad;
              if (lote.cantidad <= 0) state.stock = state.stock.filter(s => s.id !== loteId);
              if (dbMode === 'supabase') {
                if (lote.cantidad > 0) await DB.update('stock_lotes', lote.id, { cantidad: lote.cantidad });
                else await DB.remove('stock_lotes', lote.id);
              }
            }
          }
          // Registrar movimiento de inventario (salida)
          const movInv = {
            id: uid(),
            tipo: 'salida',
            productoId: it.productoId,
            producto_id: it.productoId,
            cantidad: it.cantidad,
            costoUnit: producto.costo || 0,
            costo_unit: producto.costo || 0,
            lote: it.loteId ? (state.stock.find(s => s.id === it.loteId)?.lote || '') : '',
            fecha: data.fecha,
            motivo: `${data.tipoComprobante} ${data.numero} - ${data.concepto}`,
            refTipo: 'comprobante',
            refId: movCC.id,
            usuario: currentUser?.email || 'Admin'
          };
          if (!state.movimientos) state.movimientos = [];
          state.movimientos.push(movInv);
          if (dbMode === 'supabase') await DB.insert('movimientos_inventario', movInv);
          
        } else {
          // PROVEEDOR: Entrada de stock (ingreso)
          const nuevoLote = {
            id: uid(),
            productoId: it.productoId,
            producto_id: it.productoId,
            cantidad: it.cantidad,
            costoUnit: it.precioUnit || producto.costo || 0,
            costo_unit: it.precioUnit || producto.costo || 0,
            lote: it.loteId || `L-${data.numero}-${Date.now().toString().slice(-4)}`,
            vencimiento: null,
            fecha: data.fecha,
            movimiento: 'compra_manual'
          };
          state.stock.push(nuevoLote);
          if (dbMode === 'supabase') await DB.insert('stock_lotes', nuevoLote);
          
          // Registrar movimiento de inventario (entrada)
          const movInv = {
            id: uid(),
            tipo: 'entrada',
            productoId: it.productoId,
            producto_id: it.productoId,
            cantidad: it.cantidad,
            costoUnit: it.precioUnit || producto.costo || 0,
            costo_unit: it.precioUnit || producto.costo || 0,
            lote: nuevoLote.lote,
            fecha: data.fecha,
            motivo: `${data.tipoComprobante} ${data.numero} - ${data.concepto}`,
            refTipo: 'comprobante',
            refId: movCC.id,
            usuario: currentUser?.email || 'Admin'
          };
          if (!state.movimientos) state.movimientos = [];
          state.movimientos.push(movInv);
          if (dbMode === 'supabase') await DB.insert('movimientos_inventario', movInv);
        }
      }
    }

    saveLocal(); 
    closeModal();
    
    let msg = 'Comprobante registrado';
    if (vaLibroIva) msg += ` | ${esCliente ? 'IVA Ventas' : 'IVA Compras'}`;
    if (conProductos) msg += ` | ${comprobanteItems.length} producto(s)`;
    toast(msg);
    refreshCurrent();
  } catch (error) {
    console.error('[saveComprobanteManual] Error:', error);
    toast('Error: ' + error.message, 'error');
  }
}

async function saveCajaMovimiento(tipo) {
  const data = getFormData('formCaja', ['fecha','medioPago','entidadId','importe','concepto','numeroRecibo','puntoVenta']);
  if (!data) return;
  const importe = parseFloat(data.importe) || 0;
  if (importe <= 0) { toast('El importe debe ser mayor a 0','error'); return; }
  if (!data.entidadId) { toast('Debe seleccionar una entidad (cliente/proveedor)','error'); return; }
  
  const datosExtra = {};
  if (data.medioPago === 'cheque') { datosExtra.numero = data.chequeNumero || ''; datosExtra.banco = data.chequeBanco || ''; datosExtra.titular = data.chequeTitular || ''; datosExtra.fecha_emision = data.chequeFechaEmision || ''; datosExtra.fecha_vencimiento = data.chequeFechaVenc || ''; }
  else if (data.medioPago === 'tarjeta') { datosExtra.tipo = data.tarjetaTipo || ''; datosExtra.numero_operacion = data.tarjetaOperacion || ''; datosExtra.cuotas = parseInt(data.tarjetaCuotas) || 1; datosExtra.fecha_liquidacion = data.tarjetaLiquidacion || ''; }
  else if (data.medioPago === 'transferencia') { datosExtra.banco = data.transfBanco || ''; datosExtra.referencia = data.transfReferencia || ''; datosExtra.fecha_acreditacion = data.transfFecha || ''; }
  
  let estado = 'pendiente';
  if (tipo === 'ingreso' && data.medioPago === 'cheque') estado = 'en_cartera';
  
  // 1. Crear movimiento de Caja
  const movCaja = {
    id: uid(), fecha: data.fecha, tipo: tipo, concepto: data.concepto,
    medioPago: data.medioPago, importe: importe,
    entidadTipo: tipo === 'ingreso' ? 'cliente' : 'proveedor',
    entidadId: data.entidadId, numeroRecibo: data.numeroRecibo,
    puntoVenta: data.puntoVenta, datosExtra: datosExtra,
    estado: estado, observaciones: data.observaciones || '',
    usuario: currentUser?.email || 'Admin'
  };
  state.caja.push(movCaja);
  if (dbMode === 'supabase') await DB.insert('caja_movimientos', movCaja);
  
  // 2. Crear asiento en Cuentas Corrientes (Recibo si es ingreso, Pago si es egreso)
  const tipoComprobante = tipo === 'ingreso' ? 'Recibo' : 'Pago';
  const movCC = {
    id: uid(), tipo: movCaja.entidadTipo, entityId: movCaja.entidadId,
    fecha: data.fecha, tipoComprobante: tipoComprobante,
    puntoVenta: data.puntoVenta, numero: data.numeroRecibo,
    concepto: data.concepto || `${tipoComprobante} ${data.numeroRecibo}`,
    total: importe,
    debe: tipo === 'egreso' ? importe : 0,
    haber: tipo === 'ingreso' ? importe : 0,
    medio: data.medioPago, observaciones: `Generado desde Caja ${movCaja.numeroRecibo}`,
    refTipo: 'caja', refId: movCaja.id,
    usuario: currentUser?.email || 'Admin'
  };
  state.cuentas.push({ ...movCC, entityId: movCC.entityId });
  if (dbMode === 'supabase') await DB.insert('cuentas_corrientes', movCC);
  
// 3. Imputación FIFO VISUAL (solo registra, NO modifica saldos de comprobantes)
// El saldo ya se afecta correctamente por el movimiento de Recibo/Pago creado arriba
const pendientes = getComprobantesPendientes(movCC.entityId, movCC.tipo);
let importeRestante = importe;
const imputacionesDetalladas = [];

for (const comp of pendientes) {
  if (importeRestante <= 0.01) break;
  const montoAImputar = Math.min(comp.saldoPendiente, importeRestante);
  imputacionesDetalladas.push({ comprobanteId: comp.id, importeImputado: montoAImputar });
  // NO modificamos compReal.haber/debe - la imputación es solo visual/informativa
  importeRestante -= montoAImputar;
} 
 
// 4. Crear registros en caja_imputaciones
  for (const imp of imputacionesDetalladas) {
    const nuevaImp = {
      id: uid(), movimientoId: movCaja.id, comprobanteId: imp.comprobanteId,
      importeImputado: imp.importeImputado, fecha: data.fecha,
      usuario: currentUser?.email || 'Admin'
    };
    state.cajaImputaciones.push(nuevaImp);
    if (dbMode === 'supabase') await DB.insert('caja_imputaciones', nuevaImp);
  }
  
  // 5. Actualizar estado del movimiento de caja según imputación
  const totalImputado = imputacionesDetalladas.reduce((s, i) => s + i.importeImputado, 0);
  if (totalImputado <= 0) movCaja.estado = 'pendiente';
  else if (Math.abs(totalImputado - importe) < 0.01) movCaja.estado = 'imputado_total';
  else movCaja.estado = 'imputado_parcial';
  
  if (dbMode === 'supabase') await DB.update('caja_movimientos', movCaja.id, { estado: movCaja.estado });
  
  saveLocal(); closeModal();
  
  let msg = `${tipo === 'ingreso' ? 'Ingreso' : 'Egreso'} registrado: ${movCaja.numeroRecibo}`;
  if (imputacionesDetalladas.length > 0) msg += ` | ${imputacionesDetalladas.length} comprobante(s) imputado(s)`;
  if (importeRestante > 0.01) msg += ` | Quedan ${fmt(importeRestante)} sin imputar`;
  toast(msg);
  refreshCurrent();
}

async function anularCajaMovimiento(id) {
  if (!confirm('¿Anular este movimiento? No se eliminará, quedará marcado como anulado.')) return;
  const mov = state.caja.find(m => m.id === id);
  if (!mov) return;
  const imps = state.cajaImputaciones.filter(i => i.movimientoId === id);
  for (const imp of imps) { if (dbMode === 'supabase') await DB.remove('caja_imputaciones', imp.id); }
  state.cajaImputaciones = state.cajaImputaciones.filter(i => i.movimientoId !== id);
  mov.estado = 'anulado';
  if (dbMode === 'supabase') await DB.update('caja_movimientos', id, { estado: 'anulado' });
  saveLocal(); toast('Movimiento anulado'); refreshCurrent();
}

    const chk = document.querySelector(`.chkComp[data-id="${inp.dataset.id}"]`);
    if (chk && chk.checked) {
      const imp = parseFloat(inp.value) || 0;
      if (imp > 0) imps.push({ comprobanteId: inp.dataset.id, importeImputado: imp });
      totalImp += imp;
    }
  });
  if (totalImp <= 0) { toast('Seleccione al menos un comprobante con importe > 0','error'); return; }
  if (totalImp > disp + 0.01) { toast(`El total a imputar (${fmt(totalImp)}) supera el disponible (${fmt(disp)})`,'error'); return; }
  for (const imp of imps) {
    const nuevaImp = { id: uid(), movimientoId: movimientoId, comprobanteId: imp.comprobanteId, importeImputado: imp.importeImputado, fecha: today(), usuario: currentUser?.email || 'Admin' };
    state.cajaImputaciones.push(nuevaImp);
    const comp = state.cuentas.find(c => c.id === imp.comprobanteId);
    if (comp) {
      if (mov.tipo === 'ingreso') comp.haber = (comp.haber || 0) + imp.importeImputado;
      else comp.debe = (comp.debe || 0) - imp.importeImputado;
      if (dbMode === 'supabase') await DB.update('cuentas_corrientes', comp.id, { debe: comp.debe, haber: comp.haber });
    }
    if (dbMode === 'supabase') await DB.insert('caja_imputaciones', nuevaImp);
  }
  actualizarEstadoMovimiento(movimientoId);
  if (mov.estado !== 'pendiente' && mov.estado !== 'imputado_parcial' && mov.estado !== 'imputado_total') mov.estado = 'pendiente';
  if (dbMode === 'supabase') await DB.update('caja_movimientos', movimientoId, { estado: mov.estado });
  saveLocal(); closeModal(); toast(`Imputación registrada: ${fmt(totalImp)}`); refreshCurrent();
}

  if (!url.startsWith('https://') || !url.includes('supabase.co')) { resultDiv.innerHTML = `<div class="flex items-center gap-3 p-4 rounded-lg bg-amber-50 border-2 border-amber-300"><i class="fas fa-exclamation-triangle text-amber-600 text-xl"></i><div><div class="font-bold text-amber-800">Advertencia: URL inválida</div><div class="text-sm text-amber-600">La URL debe ser https://xxxxxxxx.supabase.co</div></div></div>`; btnTest.disabled = false; btnTest.classList.remove('opacity-50'); return; }
  try {
    const ok = await DB.init(url, key);
    if (!ok) { resultDiv.innerHTML = `<div class="flex items-center gap-3 p-4 rounded-lg bg-red-50 border-2 border-red-300"><i class="fas fa-times-circle text-red-600 text-xl"></i><div><div class="font-bold text-red-800">✗ Conexión FALLIDA</div><div class="text-sm text-red-600">No se pudo cargar el SDK de Supabase o crear el cliente</div></div></div>`; }

function saveConexion() {
  const url = document.getElementById('connUrl').value.trim();
  const key = document.getElementById('connKey').value.trim();
  if (!url || !key) { toast('Complete URL y Anon Key','error'); return; }
  SafeStorage.set(SB_CONFIG_KEY, JSON.stringify({ url, key }));
  toast('Credenciales guardadas');
  DB.init(url, key).then(async ok => {
    if (ok) { toast('¡Conectado a Supabase!'); await loadFromSupabase(); renderers.conexion(); }
    else { toast('Error al conectar. Verifique los datos.','error'); }
  });
}

async function limpiarDatosMovimientos() {
  // Verificación de seguridad: solo admin
  if (!currentUser || currentUser.role !== 'admin') {
    toast('Solo administradores pueden realizar esta acción', 'error');
    return;
  }
  
  const confirmacion = prompt(
    ' ADVERTENCIA CRÍTICA - INICIALIZACIÓN DE TABLAS\n\n' +
    'Esta acción ELIMINARÁ PERMANENTEMENTE todos los registros de:\n' +
    '• caja_imputaciones\n' +
    '• caja_movimientos\n' +
    '• compras\n' +
    '• cuentas_corrientes\n' +
    '• movimientos_inventario\n' +
    '• stock_lotes\n' +
    '• ventas\n\n' +
    'Se conservarán: productos, proveedores, clientes, listas_precios, vendedores.\n\n' +
    'Para confirmar, escriba la palabra: BORRAR'
  );
  
  if (confirmacion !== 'BORRAR') {
    toast('Operación cancelada', 'info');
    return;
  }
  
  if (dbMode !== 'supabase' || !supabaseClient) {
    toast('Esta función solo está disponible con conexión a Supabase', 'error');
    return;
  }
  
  toast('Inicializando tablas de movimientos...');
  
  const tablas = [
    'caja_imputaciones',
    'caja_movimientos',
    'compras',
    'cuentas_corrientes',
    'movimientos_inventario',
    'stock_lotes',
    'ventas'
  ];
  
  let ok = 0, fail = 0;
  const errores = [];
  
  for (const tabla of tablas) {
    try {
      // neq con UUID imposible para borrar TODOS los registros
      const { error } = await supabaseClient
        .from(tabla)
        .delete()
        .neq('id', '00000000-0000-0000-0000-000000000000');
      
      if (error) {
        fail++;
        errores.push(`${tabla}: ${error.message}`);
        console.error(`[limpiar] Error en ${tabla}:`, error);
      } else {
        ok++;
        console.log(`[limpiar] ✓ ${tabla} inicializada`);
      }
    } catch (e) {
      fail++;
      errores.push(`${tabla}: ${e.message}`);
    }
  }
  
  // Limpiar también el estado local
  state.compras = [];
  state.ventas = [];
  state.cuentas = [];
  state.movimientos = [];
  state.stock = [];
  state.caja = [];
  state.cajaImputaciones = [];
  saveLocal();
  
  if (fail === 0) {
    toast(`✓ ${ok} tablas inicializadas correctamente`, 'success');
  } else {
    toast(`⚠ ${ok} OK, ${fail} con errores. Revise consola (F12)`, 'error');
    console.error('[limpiar] Errores:', errores);
  }
  
  refreshCurrent();
}


function disconnectConexion() {
  if (!confirm('¿Desconectar de Supabase? Los datos locales se mantendrán.')) return;
  SafeStorage.remove(SB_CONFIG_KEY);
  dbMode = 'local'; supabaseClient = null;
  updateDbStatus(); toast('Desconectado'); renderers.conexion();
}

async function loadFromSupabase() {
  if (dbMode !== 'supabase' || !supabaseClient) {
    console.log('No conectado a Supabase, usando datos locales');
    return false;
  }
  console.log('=== CARGANDO DATOS DESDE SUPABASE ===');
  toast('Cargando datos desde Supabase...');
  try {
    // 13 consultas en paralelo (12 originales + app_users)
    const [
      clientesRes, proveedoresRes, vendedoresRes, productosRes,
      listasRes, stockRes, comprasRes, ventasRes,
      cuentasRes, movimientosRes,
      cajaRes, cajaImpRes, usuariosRes
    ] = await Promise.all([
      supabaseClient.from('clientes').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('proveedores').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('vendedores').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('productos').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('listas_precios').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('stock_lotes').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('compras').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('ventas').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('cuentas_corrientes').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('movimientos_inventario').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('caja_movimientos').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('caja_imputaciones').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('app_users').select('*').order('created_at', { ascending: false })
    ]);
    
    // Validar errores de las 13 consultas
    if (clientesRes.error) throw new Error('Clientes: ' + clientesRes.error.message);
    if (proveedoresRes.error) throw new Error('Proveedores: ' + proveedoresRes.error.message);
    if (vendedoresRes.error) throw new Error('Vendedores: ' + vendedoresRes.error.message);
    if (productosRes.error) throw new Error('Productos: ' + productosRes.error.message);
    if (listasRes.error) throw new Error('Listas: ' + listasRes.error.message);
    if (stockRes.error) throw new Error('Stock: ' + stockRes.error.message);
    if (comprasRes.error) throw new Error('Compras: ' + comprasRes.error.message);
    if (ventasRes.error) throw new Error('Ventas: ' + ventasRes.error.message);
    if (cuentasRes.error) throw new Error('Cuentas: ' + cuentasRes.error.message);
    if (movimientosRes.error) throw new Error('Movimientos: ' + movimientosRes.error.message);
    if (cajaRes.error) throw new Error('Caja: ' + cajaRes.error.message);
    if (cajaImpRes.error) throw new Error('Caja Imputaciones: ' + cajaImpRes.error.message);
    if (usuariosRes.error) throw new Error('Usuarios: ' + usuariosRes.error.message);
    
    // Reemplazar state con datos de Supabase
    state = {
      clientes: clientesRes.data || [],
      proveedores: proveedoresRes.data || [],
      vendedores: vendedoresRes.data || [],
      productos: productosRes.data || [],
      listas: listasRes.data || [],
      stock: stockRes.data || [],
      compras: comprasRes.data || [],
      ventas: ventasRes.data || [],
      cuentas: cuentasRes.data || [],
      movimientos: movimientosRes.data || [],
      caja: cajaRes.data || [],
      cajaImputaciones: cajaImpRes.data || [],
      categorias: state.categorias || ['Lácteos','Carnes','Panadería','Bebidas','Conservas','Frutas y Verduras','Snacks','Cereales','Congelados','Enlatados'],
      zonas: state.zonas || ['Zona Norte','Zona Sur','Zona Este','Zona Oeste','Centro','Interior']
    };
    
    // ==========================================
    // CARGAR Y SINCRONIZAR USUARIOS DESDE SUPABASE
    // ==========================================
    const usuariosSupabase = usuariosRes.data || [];
    if (usuariosSupabase.length > 0) {
      appUsers = usuariosSupabase.map(u => ({
        id: u.id,

      }));
      saveUsers(); // Guardar en localStorage para que el login local funcione
    } else if (appUsers.length === 0) {
      // Fallback: si no hay usuarios en Supabase ni local, crear admin por defecto
      appUsers = [{
        id: uid(),
        email: 'admin@gestcom.com',
        password: 'admin123',
        full_name: 'Administrador',
        role: 'admin',
        activo: true,
        permisos: typeof getDefaultPerms === 'function' ? getDefaultPerms() : {},
        created_at: new Date().toISOString()
      }];
      saveUsers();
    }

    // Normalizar campos snake_case → camelCase
    state.stock.forEach(s => { if (s.producto_id && !s.productoId) s.productoId = s.producto_id; if (s.costo_unit !== undefined && s.costoUnit === undefined) s.costoUnit = s.costo_unit; });

    state.cuentas.forEach(c => { if (c.entity_id && !c.entityId) c.entityId = c.entity_id; if (c.tipo_comprobante && !c.tipoComprobante) c.tipoComprobante = c.tipo_comprobante; if (c.punto_venta && !c.puntoVenta) c.puntoVenta = c.punto_venta; if (c.otros_imp !== undefined && c.otrosImp === undefined) c.otrosImp = c.otros_imp; if (c.total !== undefined && c.total !== null) c.total = parseFloat(c.total)||0; if (c.ref_tipo && !c.refTipo) c.refTipo = c.ref_tipo; if (c.ref_id && !c.refId) c.refId = c.ref_id; if (c.va_libro_iva !== undefined) c.vaLibroIva = c.va_libro_iva === true || c.va_libro_iva === 't' || c.va_libro_iva === 'true'; if (c.tiene_productos !== undefined) c.tieneProductos = c.tiene_productos === true || c.tiene_productos === 't' || c.tiene_productos === 'true'; });

    state.movimientos.forEach(m => { if (m.producto_id && !m.productoId) m.productoId = m.producto_id; if (m.costo_unit !== undefined && m.costoUnit === undefined) m.costoUnit = m.costo_unit; });
    state.compras.forEach(c => { if (c.proveedor_id && !c.proveedorId) c.proveedorId = c.proveedor_id; });
    state.ventas.forEach(v => { if (v.cliente_id && !v.clienteId) v.clienteId = v.cliente_id; if (v.vendedor_id && !v.vendedorId) v.vendedorId = v.vendedor_id; });
    state.clientes.forEach(c => { if (c.razon_social && !c.razonSocial) c.razonSocial = c.razon_social; if (c.lista_id && !c.listaId) c.listaId = c.lista_id; if (c.vendedor_id && !c.vendedorId) c.vendedorId = c.vendedor_id; if (c.limite_credito !== undefined && c.limite === undefined) c.limite = c.limite_credito; });
    state.proveedores.forEach(p => { if (p.razon_social && !p.razonSocial) p.razonSocial = p.razon_social; });
    state.productos.forEach(p => { if (p.precio_lista !== undefined && p.precioLista === undefined) p.precioLista = p.precio_lista; if (p.stock_min !== undefined && p.stockMin === undefined) p.stockMin = p.stock_min; });
    state.listas.forEach(l => { if (l.depende_id && !l.depende) l.depende = l.depende_id; });
    state.vendedores.forEach(v => { if (v.fecha_ingreso && !v.fechaIngreso) v.fechaIngreso = v.fecha_ingreso; });
    
    // Normalizar Caja
    state.caja.forEach(c => {
      if (c.medio_pago) c.medioPago = c.medio_pago;
      if (c.entidad_tipo) c.entidadTipo = c.entidad_tipo;
      if (c.entidad_id) c.entidadId = c.entidad_id;
      if (c.numero_recibo) c.numeroRecibo = c.numero_recibo;
      if (c.datos_extra) {
        if (typeof c.datos_extra === 'string') { try { c.datosExtra = JSON.parse(c.datos_extra); } catch(e) { c.datosExtra = {}; } }
        else c.datosExtra = c.datos_extra;
      }
      if (!c.datosExtra || typeof c.datosExtra !== 'object') c.datosExtra = {};
    });
    state.cajaImputaciones.forEach(i => {
      if (i.movimiento_id) i.movimientoId = i.movimiento_id;
      if (i.comprobante_id) i.comprobanteId = i.comprobante_id;
      if (i.importe_imputado !== undefined) i.importeImputado = i.importe_imputado;
    });
    
    // Log completo de las 13 tablas
    console.log('Datos cargados desde Supabase:', {
      clientes: state.clientes.length,
      proveedores: state.proveedores.length,
      vendedores: state.vendedores.length,
      productos: state.productos.length,
      listas: state.listas.length,
      stock: state.stock.length,
      compras: state.compras.length,
      ventas: state.ventas.length,
      cuentas: state.cuentas.length,
      movimientos: state.movimientos.length,
      caja: state.caja.length,
      cajaImputaciones: state.cajaImputaciones.length,
      usuarios: appUsers.length
    });
    
    saveLocal();
    toast(`Datos cargados: ${state.clientes.length} clientes, ${state.productos.length} productos, ${appUsers.length} usuarios`, 'success');
    if (currentModule && renderers[currentModule]) renderers[currentModule]();
    return true;
  } catch (error) {
    console.error('Error cargando desde Supabase:', error);
    toast('Error cargando datos: ' + error.message, 'error');
    return false;
  }
}

async function saveUser() {
  console.log("🔍 [1] saveUser iniciado");
  
  const data = getFormData('formUser', ['email', 'password']);
  console.log("🔍 [2] Datos obtenidos del formulario:", data);
  
  if (!data) {
    console.log("⚠️ [3] getFormData devolvió vacío. Saliendo.");
    return;
  }

  // Validar email único (buscamos en el array local actual)
  const existente = appUsers.find(u => u.email.toLowerCase() === data.email.toLowerCase());
  if (existente) {
    console.log("⚠️ [4] El email ya existe en appUsers. Saliendo.");
    toast('El email ya está registrado', 'error');
    return;
  }

  console.log("🔍 [5] Creando objeto newUser...");
  const newUser = {
    id: uid(),
    email: data.email.toLowerCase(),
    password: data.password,
    full_name: data.full_name || data.email.split('@')[0],
    role: data.role || 'user',
    // Para checkboxes, a veces getFormData falla, leemos directo del DOM por seguridad
    activo: document.getElementById('chkActivo') ? document.getElementById('chkActivo').checked : (data.activo !== false),
    permisos: typeof getDefaultPerms === 'function' ? getDefaultPerms() : {},
    created_at: new Date().toISOString()
  };
  console.log("🔍 [6] Objeto newUser creado:", newUser);

  console.log("🔍 [7] Actualizando estado local (appUsers.push)...");
  appUsers.push(newUser);
  saveUsers(); // Guarda en localStorage

  console.log("🔍 [8] Verificando modo de base de datos. dbMode actual es:", dbMode);
  
  if (dbMode === 'supabase' && typeof supabaseClient !== 'undefined') {
    console.log("🔍 [9] dbMode es 'supabase'. Intentando DB.insert...");
    try {
      const res = await DB.insert('app_users', newUser);
      console.log("🔍 [10] Respuesta de DB.insert:", res);
      
      if (res.error) {
        console.error('❌ [11] Error de Supabase:', res.error);
        toast('Usuario guardado localmente, pero falló en la nube: ' + res.error.message, 'warning');
      } else {
        console.log("✅ [12] ¡Guardado en Supabase exitoso!");
        toast('Usuario guardado en la nube ✓', 'success');
      }
    } catch (e) {
      console.error('❌ [13] Excepción no capturada en DB.insert:', e);
      toast('Error inesperado al conectar con la nube', 'error');
    }
  } else {
    console.warn("⚠️ [14] NO se intentó guardar en Supabase. Motivo: dbMode es '" + dbMode + "' o supabaseClient no existe.");
    toast('Guardado SOLO en el navegador (Modo: ' + dbMode + ')', 'warning');
  }

  console.log("🔍 [15] Cerrando modal y refrescando pantalla...");
  closeModal();
  refreshCurrent();
}

function toggleUserStatus(id) { const u = appUsers.find(x=>x.id===id); if (!u) return; if (u.id === currentUser.id) { toast('No puede desactivar su propia sesión','error'); return; } u.activo = !u.activo; saveUsers(); toast(u.activo ? 'Usuario activado' : 'Usuario desactivado'); refreshCurrent(); }
function delUser(id) { if (id === currentUser.id) { toast('No puede eliminar su propia cuenta','error'); return; } if (id === 'admin-default') { toast('No puede eliminar el admin principal','error'); return; } if (!confirm('¿Eliminar?')) return; appUsers = appUsers.filter(x=>x.id!==id); saveUsers(); toast('Usuario eliminado'); refreshCurrent(); }
function verPermisos(id) {
  const u = appUsers.find(x=>x.id===id);
  if (!u) return;
  const groups = {};
  MODULES.forEach(m => { if (!groups[m.group]) groups[m.group] = []; groups[m.group].push(m); });
  openModal(`Permisos de ${u.full_name||u.email}`, `
    <div class="mb-3"><span class="badge ${u.role==='admin'?'badge-danger':'badge-info'}">${u.role}</span>${u.activo ? '<span class="badge badge-success ml-2">Activo</span>' : '<span class="badge badge-danger ml-2">Inactivo</span>'}</div>
    ${u.role==='admin' ? '<div class="bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-sm text-emerald-800 mb-3"><i class="fas fa-crown mr-1"></i> Los administradores tienen acceso total</div>' : ''}
    <div class="space-y-3">${Object.keys(groups).map(g=>`<div><h4 class="text-xs font-bold text-slate-500 uppercase mb-2">${g}</h4><div class="grid grid-cols-2 gap-2">${groups[g].map(m=>{ const has = u.role==='admin' || (u.permisos && u.permisos[m.id]); return `<div class="flex items-center gap-2 p-2 rounded ${has?'bg-emerald-50 border border-emerald-200':'bg-slate-50 border border-slate-200 opacity-60'}"><i class="fas ${has?'fa-check-circle text-emerald-600':'fa-times-circle text-slate-400'}"></i><i class="fas ${m.icon} text-slate-600"></i><span class="text-sm">${m.name}</span></div>`; }).join('')}</div></div>`).join('')}</div>`);
}

loadLocal();
// Ejecutar auto-conexión al iniciar la aplicación
initAutoConexion();
(async function restoreConexion() {
  try {
    const cfgStr = SafeStorage.get(SB_CONFIG_KEY);
    if (cfgStr) {
      const cfg = JSON.parse(cfgStr);
      if (cfg.url && cfg.key) {
        const ok = await DB.init(cfg.url, cfg.key);
        if (ok) { console.log('Conexión Supabase restaurada, cargando datos...'); await loadFromSupabase(); }
      }
    }
  } catch(e) { console.warn('No se pudo restaurar conexión:', e.message); }
})();
const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
document.getElementById('currentDate').textContent = new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'short',year:'numeric'});
document.getElementById('currentDay').textContent = dias[new Date().getDay()];
</script>
